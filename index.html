      for (const b of bands) {
        if (b.length < 2) continue;
        n++;

        const cx = widest.x + widest.w / 2;
        if (cx > pg.rectW * 0.5) rightAnchor++; else leftAnchor++;

        const bot = Math.max.apply(null, b.map(q => q.y + q.h));
        const ov = Math.min(bot, p.y + p.h) - Math.max(top, p.y);
        if (ov > Math.min(bot - top, p.h) * 0.5) { b.push(p); placed = true; break; }
      }

      if (p === q) continue;
      if (Workers.localCore.contains(q, p, 3) && q.w * q.h > p.w * p.h * 1.35) {
        const cur = parents.get(p);

    const top = all.filter(p => !parents.has(p));

    bands.sort((a, b) => Math.min.apply(null, a.map(p => p.y)) - Math.min.apply(null, b.map(p => p.y)));

    for (const b of bands) {
      b.sort((p, q) => rtl ? (q.x + q.w) - (p.x + p.w) : p.x - q.x);

      // column must precede it (staircase layouts break a pure horizontal sweep)
      const refined = topo(b, rtl);

      }

      if (ovX > Math.min(a.w, b.w) * 0.6 && a.y + a.h <= b.y + 4) edges.push([i, j]);

      // PDF user-space is bottom-left origin; keep only panel-scale rectangles
      const pw = pg.crop.w, ph = pg.crop.h;
      const cand = pg.pdfRects.filter(r => Math.abs(r.w) > pw * 0.12 && Math.abs(r.h) > ph * 0.08 &&
        Math.abs(r.w) < pw * 0.99 && Math.abs(r.h) < ph * 0.99);
      if (cand.length >= 2 && cand.length <= 14) {
        const panels = cand.map(r => {
          const x = Math.min(r.x, r.x + r.w) * pg.scale;
          const w = Math.abs(r.w) * pg.scale, h = Math.abs(r.h) * pg.scale;
          const yTop = (ph - (Math.min(r.y, r.y + r.h) + Math.abs(r.h))) * pg.scale;
          const q = [[x, yTop], [x + w, yTop], [x + w, yTop + h], [x, yTop + h]];
          return { x, y: yTop, w, h, quadW: q, conf: 0.95, meta: true };
        });
        return { panels, source: "PDF vector rectangles" };
      }
    }
    return null;
  }

  function edgeLinesFrom(layouts, W, H) {
    const xs = [0, W], ys = [0, H];
    for (const L of layouts || []) for (const p of L.panels) { xs.push(p.x, p.x + p.w); ys.push(p.y, p.y + p.h); }
    return {
      xs: Workers.localCore.clusterCoords(xs, W * 0.012, 22),
      ys: Workers.localCore.clusterCoords(ys, H * 0.012, 26)
    };
  }

  async function processPage(pg, seed) {
    const t0 = nowMs();
    pg.status = "working";
    UI.updateQueueCard(pg);
    const meta = fromMetadata(pg);
    if (meta) {
      pg.panels = meta.panels; pg.score = 0.99; pg.layouts = [{ engine: meta.source, score: 0.99, panels: meta.panels }];
      pg.polarity = "n/a"; pg.params = null; pg.note = meta.source;
      pg.diag = { ms: Math.round(nowMs() - t0), source: meta.source, evals: 0 };
      pg.status = "done";
      UI.toast("Exact panel data found -- " + meta.source + ".", { kind: "ok", once: "metadata" });
      return pg;
    }
    let px;
    try { px = await toRGBA(pg); }
    catch (e) {
      pg.status = "error"; pg.error = e.message;
      Logger.error("pipeline", "decode failed: " + pg.name, e.message);
      UI.toast("Couldn't read "" + pg.name + "" -- skipped.", { kind: "warn" });
      return pg;
    }
    const opts = {
      samples: Store.s.slowDevice ? CONFIG.TUNE_SAMPLES_SLOW : CONFIG.TUNE_SAMPLES,
      seedParams: seed || null,
      skipEngines: Store.s.slowDevice ? ["wshed"] : null,   // costliest engine first to go
      noRectify: pg.webtoon
    };
    let out;
    try {
      out = await Workers.detect({ rgba: px.rgba, W: px.W, H: px.H, opts, weights: Store.s.project.weights, grid: null });
    } catch (e) {
      Logger.error("pipeline", "detect failed: " + pg.name, String(e.message || e));
      // OOM recovery: drop working resolution and continue rather than crash
      if (/memory|allocation/i.test(String(e.message || e)) && pg.scale > 0.25) {
        Store.s.adaptiveCap = CONFIG.WORK_EDGE_SLOW;
        pg.scale = Math.min(1, CONFIG.WORK_EDGE_SLOW / Math.max(pg.crop.w, pg.crop.h));
        Logger.warn("pipeline", "memory pressure -- working cap lowered", { cap: CONFIG.WORK_EDGE_SLOW });
        UI.toast("Low memory -- continuing at reduced working resolution.", { kind: "warn", once: "oom" });
        return processPage(pg, seed);
      }
      pg.status = "error"; pg.error = String(e.message || e);
      return pg;
    }
    pg.rectW = out.rectW; pg.rectH = out.rectH;
    pg.panels = out.panels; pg.score = out.score; pg.score0 = out.score;
    pg.layouts = out.layouts; pg.params = out.params; pg.polarity = out.polarity;
    pg.note = out.preNote;
    pg.diag = {
      ms: Math.round(nowMs() - t0), engineMs: out.engineTimes, counts: out.engineCounts,
      terms: out.terms, evals: out.evals, trail: out.trail, polarity: out.polarity, note: out.preNote
    };

    // webtoon strips: vertical-only segmentation is the correct interpretation
    if (pg.webtoon && pg.panels.length < 2) {
      const vertical = pg.layouts.find(L => L.panels.length > 1 && L.panels.every(p => p.w > pg.rectW * 0.8));
      if (vertical) { pg.panels = vertical.panels; pg.score = vertical.score; pg.note = "vertical strip"; }
    }

    // ---- escalation: neural, then cloud. Both fuse-and-snap, never replace blindly.
    const pageFilling = pg.panels.length === 1 &&
      pg.panels[0].w > pg.rectW * 0.9 && pg.panels[0].h > pg.rectH * 0.9;
    const implausible = pg.panels.length === 0 || pg.panels.length > 12;
    if ((pg.score < CONFIG.NEURAL_BELOW || pageFilling || implausible) && Store.s.settings.neural) {
      await Neural.init();
      if (!Neural.inert) {
        setStage("Neural pass", pg.name);
        const boxes = await Neural.detect(px.rgba, px.W, px.H);
        if (boxes && boxes.length) {
          const snapped = snapBoxesToEdges(boxes, edgeLinesFrom(pg.layouts, px.W, px.H), px.W, px.H);
          const merged = mergeEscalated(pg, snapped, "neural");
          if (merged) { pg.diag.neural = { boxes: boxes.length, accepted: true, delta: +(pg.score - pg.score0).toFixed(3) }; }
          else pg.diag.neural = { boxes: boxes.length, accepted: false };
        }
      }
    }
    if (pg.score < CONFIG.CLOUD_BELOW && Cloud.enabled()) {
      setStage("Cloud assist", pg.name);
      const jpg = await pageJpeg(pg, px);
      const boxes = jpg ? await Cloud.assist(jpg.blob, jpg.W, jpg.H) : null;
      if (boxes) {
        const sc = px.W / jpg.W;
        const scaled = boxes.map(b => ({ x: b.x * sc, y: b.y * sc, w: b.w * sc, h: b.h * sc, s: b.s }));
        const snapped = snapBoxesToEdges(scaled, edgeLinesFrom(pg.layouts, px.W, px.H), px.W, px.H);
        const ok = mergeEscalated(pg, snapped, "cloud");
        pg.diag.cloud = { boxes: boxes.length, accepted: !!ok };
      }
    }

    // per-engine reliability EMA: engines that agree with the winning layout gain weight
    updateEngineWeights(pg, out);

    // precision over recall: silently discard low-confidence panels
    const before = pg.panels.length;
    pg.panels = pg.panels.filter(p => (p.conf === undefined ? 1 : p.conf) >= CONFIG.CONF_KEEP);
    pg.diag.dropped = before - pg.panels.length;
    for (const p of pg.panels) p.sel = (p.conf === undefined ? 1 : p.conf) >= CONFIG.CONF_SELECT;
    pg.gutter = estimateGutter(pg);
    pg.status = pg.panels.length ? "done" : "empty";
    if (!pg.panels.length) Logger.info("pipeline", "no panels found on " + pg.name + " (cover/credits/ad?)");
    px.rgba = null;
    return pg;
  }

  /* Accept an escalated interpretation only if the scorer prefers it. Rebuild
     confidence from cross-engine agreement plus the escalation source. */
  function mergeEscalated(pg, boxes, source) {
    const core = Workers.localCore;
    const cand = core.sanitize(boxes.map(b => ({ x: b.x, y: b.y, w: b.w, h: b.h })), pg.rectW, pg.rectH);
    if (!cand.length) return false;
    // structural gain: escalation is trusted for COUNT, classical for edges
    const gain = (cand.length > pg.panels.length && pg.panels.length <= 1) ||
      (pg.score < 0.7 && Math.abs(cand.length - pg.panels.length) >= 1);
    if (!gain) return false;
    const merged = cand.map((c, i) => {
      const cls = pg.panels.find(p => core.iou(p, c) > 0.55);
      const base = cls ? { x: cls.x, y: cls.y, w: cls.w, h: cls.h, quad: cls.quad, poly: cls.poly } : c;
      return Object.assign({}, base, {
        conf: clamp((boxes[i] && boxes[i].conf ? boxes[i].conf : 0.72) * (cls ? 1.08 : 0.92), 0, 0.97),
        quadW: (base.quad || base.poly || core.quadOf(base)),
        source
      });
    });
    pg.panels = merged;
    pg.score = Math.max(pg.score, 0.8);
    pg.layouts = [{ engine: source + "+snap", score: pg.score, panels: merged }].concat(pg.layouts).slice(0, CONFIG.ALT_LAYOUTS);
    Logger.info("pipeline", source + " accepted for " + pg.name, { panels: merged.length });
    return true;
  }
  function updateEngineWeights(pg, out) {
    const w = Store.s.project.weights, a = CONFIG.ENGINE_EMA;
    const chosen = pg.panels;
    for (const k in (out.engineCounts || {})) {
      const list = (out.layouts.find(L => L.engine === k) || { panels: [] }).panels;
      let agree = 0;
      for (const p of chosen) if (list.some(q => Workers.localCore.iou(p, q) >= CONFIG.AGREE_IOU)) agree++;
      const rel = chosen.length ? agree / chosen.length : 0;
      w[k] = (w[k] === undefined ? 1 : w[k]) * (1 - a) + (0.35 + rel * 1.15) * a;
    }
  }
  function estimateGutter(pg) {
    const ps = pg.panels; if (ps.length < 2) return 0.012;
    const gaps = [];
    for (let i = 0; i < ps.length; i++) for (let j = i + 1; j < ps.length; j++) {
      const a = ps[i], b = ps[j];
      const ovY = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
      if (ovY > Math.min(a.h, b.h) * 0.5) { const g = Math.max(a.x - (b.x + b.w), b.x - (a.x + a.w)); if (g > 0) gaps.push(g / pg.rectW); }
    }
    if (!gaps.length) return 0.012;
    gaps.sort((a, b) => a - b);
    return gaps[gaps.length >> 1];
  }
  async function pageJpeg(pg, px) {
    // 1024px JPEG for upload -- small enough for free tiers, big enough for boxes
    try {
      const W = Math.min(1024, px.W), H = Math.round(px.H * (W / px.W));
      const cv = Img.makeCanvas(px.W, px.H);
      const cx = cv.getContext("2d", { alpha: false });
      cx.putImageData(new ImageData(px.rgba, px.W, px.H), 0, 0);
      const out = Img.makeCanvas(W, H), oc = out.getContext("2d", { alpha: false });
      oc.imageSmoothingQuality = "high";
      oc.drawImage(cv, 0, 0, px.W, px.H, 0, 0, W, H);
      Img.release(cv);
      const blob = await Img.toBlob(out, "image/jpeg", 0.85);
      Img.release(out);
      return { blob, W, H };
    } catch (e) { return null; }
  }

  /* ---- consensus pass: learn the issue grid, re-run weak pages with it ---- */
  async function consensus() {
    const p = Store.s.project;
    const usable = p.pages.filter(pg => pg.panels && pg.panels.length && pg.score >= 0.7);
    if (usable.length < 2) return;
    setStage("Learning issue layout", usable.length + " strong pages");
    const grid = Workers.learnGrid(usable.map(pg => ({ panels: pg.panels, score: pg.score, rectW: pg.rectW, rectH: pg.rectH, gutter: pg.gutter })));
    p.grid = grid;
    if (!grid) { Logger.info("consensus", "no stable grid recovered"); return; }
    Logger.info("consensus", "issue grid learned", { cols: grid.cols.length, rows: grid.rows.length, gutter: +grid.gutter.toFixed(4), samples: grid.samples });
    const weak = p.pages.filter(pg => pg.status !== "error" && pg.score < CONFIG.CONSENSUS_BELOW).sort((a, b) => a.score - b.score);
    let improved = 0;
    for (const pg of weak) {
      if (cancelled) break;
      setStage("Learning issue layout", "re-running " + pg.name);
      let px;
      try { px = await toRGBA(pg); } catch (e) { continue; }
      let out;
      try {
        out = await Workers.detect({
          rgba: px.rgba, W: px.W, H: px.H, grid,
          opts: { samples: Math.max(6, Math.round((Store.s.slowDevice ? CONFIG.TUNE_SAMPLES_SLOW : CONFIG.TUNE_SAMPLES) / 2)), seedParams: pg.params, skipEngines: Store.s.slowDevice ? ["wshed"] : null },
          weights: p.weights
        });
      } catch (e) { Logger.warn("consensus", "re-run failed " + pg.name, String(e.message || e)); continue; }
      const delta = out.score - (pg.score0 === undefined ? pg.score : pg.score0);
      if (out.score > pg.score + 0.01 && out.panels.length) {
        pg.panels = out.panels.filter(q => q.conf >= CONFIG.CONF_KEEP);
        for (const q of pg.panels) q.sel = q.conf >= CONFIG.CONF_SELECT;
        pg.layouts = out.layouts; pg.score = out.score; pg.params = out.params;
        pg.rectW = out.rectW; pg.rectH = out.rectH;
        pg.diag = Object.assign(pg.diag || {}, { consensus: { delta: +delta.toFixed(3), used: out.gridUsed || "grid-prior", score0: pg.score0 } });
        pg.status = pg.panels.length ? "done" : "empty";
        improved++;
        Logger.info("consensus", pg.name + " improved", { from: +(pg.score0 || 0).toFixed(3), to: +out.score.toFixed(3), delta: +delta.toFixed(3) });
      } else {
        pg.diag = Object.assign(pg.diag || {}, { consensus: { delta: +delta.toFixed(3), used: "rejected" } });
      }
      stats.improved = improved;
      UI.updateQueueCard(pg);
      UI.setStats();
      await nextFrame();
    }
    if (improved) UI.toast(improved === 1 ? "Consensus pass improved 1 page." : "Consensus pass improved " + improved + " pages.", { kind: "ok" });
  }

  async function run(pages) {
    if (running) return;
    running = true; cancelled = false;
    const p = Store.s.project;
    stats.pages = p.pages.length; stats.done = 0; stats.panels = 0; stats.improved = 0;
    UI.showProcessing();
    await Workers.probe();
    Logger.info("pipeline", "start", { pages: pages.length, workers: Workers.available ? Workers.size : 0, path: Workers.available ? "worker" : "main-thread-yielding" });
    let seed = null;
    const t0 = nowMs();
    for (let i = 0; i < pages.length; i++) {
      if (cancelled) break;
      const pg = pages[i];
      setStage("Detecting panels", pg.name);
      const pt = nowMs();
      await processPage(pg, seed);
      // warm start: pages in one issue share a production style
      if (pg.params && pg.score > 0.7) seed = pg.params;
      // adaptive quality: time the first page and back off on slow devices
      if (i === 0) {
        const cost = nowMs() - pt;
        if (cost > 4200) {
          Store.s.slowDevice = true;
          Store.s.adaptiveCap = CONFIG.WORK_EDGE_SLOW;
          Logger.warn("perf", "slow device detected -- reduced working cap, smaller tune budget, watershed skipped", { firstPageMs: Math.round(cost) });
          UI.toast("Tuned for this device -- slightly lower working resolution.", { kind: "info" });
        }
      }
      stats.done++;
      stats.panels += pg.panels.length;
      UI.updateQueueCard(pg);
      UI.setProgress((i + 1) / (pages.length + 1));
      UI.setStats();
      Persist.schedule();
      await nextFrame();
    }
    if (!cancelled) {
      await consensus();
      UI.setProgress(0.99);
      // reading order across the whole issue, then global indices
      p.rtl = ReadingOrder.detectRTL(p.pages);
      let gi = 0;
      for (const pg of p.pages) {
        ReadingOrder.order(pg, p.rtl);
        for (const q of pg.panels) q.gIndex = ++gi;
      }
      stats.panels = p.pages.reduce((n, pg) => n + pg.panels.length, 0);
      stats.avg = p.pages.length ? p.pages.reduce((s, pg) => s + pg.score, 0) / p.pages.length : 0;
      UI.setProgress(1);
      Logger.info("pipeline", "complete", {
        ms: Math.round(nowMs() - t0), panels: stats.panels, avgScore: +stats.avg.toFixed(3),
        rtl: p.rtl, improved: stats.improved
      });
      await Persist.save();
      running = false;
      UI.showResults();
      haptic("success");
    } else {
      running = false;
      UI.showLaunch();
    }
  }
  return {
    run, get running() { return running; }, stats,
    cancel() { cancelled = true; },
    processPage, consensus
  };
})();

/* ============================================================================
 * EXPORT -- crops come from FULL RESOLUTION, mapped back through the inverse
 * transform chain: panel(rect space) → quadW(working) → /scale + crop offset
 * (original pixels) → optional upright warp → preset canvas.
 * ========================================================================== */
const Exporter = (() => {
  const PRESETS = {
    kenburns: { label: "Ken Burns Ready", note: "1.4× headroom on 9:16", w: Math.round(CONFIG.OUT_W * CONFIG.KEN_OVERSIZE), h: Math.round(CONFIG.OUT_H * CONFIG.KEN_OVERSIZE), mode: "contain", bg: true },
    fit: { label: "9:16 Fit", note: "1080×1920, letterboxed", w: CONFIG.OUT_W, h: CONFIG.OUT_H, mode: "contain", bg: true },
    fill: { label: "9:16 Fill", note: "1080×1920, cropped", w: CONFIG.OUT_W, h: CONFIG.OUT_H, mode: "cover", bg: false },
    native: { label: "Native", note: "panel pixels as-is", mode: "native" },
    max: { label: "Max Quality", note: "Mitchell 2× for small panels", mode: "max" }
  };
  function selected() {
    const out = [];
    for (const pg of Store.s.project.pages)
      for (const p of pg.panels) if (p.sel) out.push({ pg, p });
    out.sort((a, b) => (a.p.gIndex || 0) - (b.p.gIndex || 0));
    return out;
  }
  /* Adaptive padding: outward bleed, reduced where a neighbour would intrude,
     increased where the panel abuts page background. */
  function padFor(pg, p) {
    const base = CONFIG.PAD[Store.s.settings.padding];
    const px = Math.max(pg.rectW, pg.rectH) * base;
    const sides = { l: px, r: px, t: px, b: px };
    for (const q of pg.panels) {
      if (q === p) continue;
      const gapL = p.x - (q.x + q.w), gapR = q.x - (p.x + p.w);
      const gapT = p.y - (q.y + q.h), gapB = q.y - (p.y + p.h);
      const ovY = Math.min(p.y + p.h, q.y + q.h) - Math.max(p.y, q.y) > Math.min(p.h, q.h) * 0.3;
      const ovX = Math.min(p.x + p.w, q.x + q.w) - Math.max(p.x, q.x) > Math.min(p.w, q.w) * 0.3;
      if (ovY && gapL >= 0) sides.l = Math.min(sides.l, gapL * 0.42);
      if (ovY && gapR >= 0) sides.r = Math.min(sides.r, gapR * 0.42);
      if (ovX && gapT >= 0) sides.t = Math.min(sides.t, gapT * 0.42);
      if (ovX && gapB >= 0) sides.b = Math.min(sides.b, gapB * 0.42);
    }
    // against the page edge there is only background: allow the full bleed
    if (p.x < pg.rectW * 0.02) sides.l = px * 1.4;
    if (p.x + p.w > pg.rectW * 0.98) sides.r = px * 1.4;
    if (p.y < pg.rectH * 0.02) sides.t = px * 1.4;
    if (p.y + p.h > pg.rectH * 0.98) sides.b = px * 1.4;
    return sides;
  }
  function fullQuad(pg, p) {
    const q = (p.quadW || Workers.localCore.quadOf(p));
    const s = pg.scale;
    return q.map(([x, y]) => [pg.crop.x + x / s, pg.crop.y + y / s]);
  }
  function isAxisAligned(q) {
    const tol = 1.6;
    return Math.abs(q[0][1] - q[1][1]) < tol && Math.abs(q[2][1] - q[3][1]) < tol &&
      Math.abs(q[0][0] - q[3][0]) < tol && Math.abs(q[1][0] - q[2][0]) < tol;
  }
  function sampleEdgeColor(cv) {
    const cx = cv.getContext("2d");
    const w = cv.width, h = cv.height;
    const pts = [[2, 2], [w - 3, 2], [2, h - 3], [w - 3, h - 3], [w >> 1, 2], [w >> 1, h - 3]];
    let r = 0, g = 0, b = 0;
    for (const [x, y] of pts) { const d = cx.getImageData(x, y, 1, 1).data; r += d[0]; g += d[1]; b += d[2]; }
    return "rgb(" + Math.round(r / pts.length) + "," + Math.round(g / pts.length) + "," + Math.round(b / pts.length) + ")";
  }
  /* Crop one panel from the already-decoded full-res page canvas. */
  function cropPanel(pageCv, pg, p, pageScaleUsed) {
    const core = Workers.localCore;
    const sides = padFor(pg, p);
    const s = pg.scale;
    let quad = fullQuad(pg, p).map(([x, y]) => [(x - pg.crop.x) * pageScaleUsed, (y - pg.crop.y) * pageScaleUsed]);
    if (isAxisAligned(quad)) {
      const r = core.rectOf(quad);
      const x0 = clamp(r.x - sides.l / s * pageScaleUsed, 0, pageCv.width - 2);
      const y0 = clamp(r.y - sides.t / s * pageScaleUsed, 0, pageCv.height - 2);
      const x1 = clamp(r.x + r.w + sides.r / s * pageScaleUsed, x0 + 2, pageCv.width);
      const y1 = clamp(r.y + r.h + sides.b / s * pageScaleUsed, y0 + 2, pageCv.height);
      const w = Math.round(x1 - x0), h = Math.round(y1 - y0);
      const out = Img.makeCanvas(w, h);
      out.getContext("2d", { alpha: false }).drawImage(pageCv, Math.round(x0), Math.round(y0), w, h, 0, 0, w, h);
      return out;
    }
    // tilted / parallelogram panel: inverse-warp to upright with bilinear sampling
    const cx = (quad[0][0] + quad[1][0] + quad[2][0] + quad[3][0]) / 4;
    const cy = (quad[0][1] + quad[1][1] + quad[2][1] + quad[3][1]) / 4;
    const grow = 1 + (sides.l + sides.r) / 2 / Math.max(1, core.rectOf(quad).w);
    quad = quad.map(([x, y]) => [cx + (x - cx) * grow, cy + (y - cy) * grow]);
    const um = core.uprightMap(quad);
    const src = pageCv.getContext("2d", { alpha: false }).getImageData(0, 0, pageCv.width, pageCv.height);
    const out = Img.makeCanvas(um.W, um.H);
    const oc = out.getContext("2d", { alpha: false });
    const id = oc.createImageData(um.W, um.H), d = id.data, sd = src.data, SW = pageCv.width, SH = pageCv.height;
    for (let y = 0; y < um.H; y++) for (let x = 0; x < um.W; x++) {
      const [sx, sy] = core.applyM(um.M, x + 0.5, y + 0.5);
      const di = (y * um.W + x) * 4;
      if (sx < 0 || sy < 0 || sx >= SW - 1 || sy >= SH - 1) { d[di] = d[di + 1] = d[di + 2] = 255; d[di + 3] = 255; continue; }
      const x0 = sx | 0, y0 = sy | 0, fx = sx - x0, fy = sy - y0;
      for (let c = 0; c < 3; c++) {
        const i00 = (y0 * SW + x0) * 4 + c, i10 = i00 + 4, i01 = i00 + SW * 4, i11 = i01 + 4;
        d[di + c] = (sd[i00] * (1 - fx) + sd[i10] * fx) * (1 - fy) + (sd[i01] * (1 - fx) + sd[i11] * fx) * fy;
      }
      d[di + 3] = 255;
    }
    oc.putImageData(id, 0, 0);
    return out;
  }
  function applyPreset(cv, presetKey) {
    const P = PRESETS[presetKey] || PRESETS.kenburns;

  /* ==========================================================================
   * PAGE INSPECTOR -- pinch-zoom page, gradient overlays, swipeable alternative
   * layouts carousel with smooth morphing, and the collapsed Advanced drawer.
   * The carousel is the answer to "I don't want to do manual work": pick a
   * different plausible interpretation instead of dragging handles.
   * ========================================================================== */
  let inspSel = [], displayed = null;
  function openInspector(pg) {
    inspectPage = pg;
    inspSel = [];
    show("insp");
    $("#it").textContent = pg.name;
    $("#isub").textContent = pg.panels.length + " panels · score " + Math.round((pg.score || 0) * 100) + "%" +
      (pg.polarity ? " · " + pg.polarity : "") + (pg.note ? " · " + pg.note : "");
    buildInspector();

  function buildInspector() {
    const pg = inspectPage;
    const stage = $("#stage2");
    stage.innerHTML = '<img alt="Page ' + esc(pg.name) + '" src="' + (pg.thumbURL || "") + '">' +
      '<svg viewBox="0 0 ' + (pg.rectW || 100) + " " + (pg.rectH || 100) + '" preserveAspectRatio="none" aria-hidden="true"></svg>';
    const img = $("img", stage);
    img.style.width = "min(92vw, 560px)";
    img.style.height = "auto";
    displayed = null;
    drawOverlay(pg.panels, true);
    if (panZoom) panZoom.reset();
    panZoom = Gestures.pinchPan($("#zoom"), stage, {
      onPinchClose: () => show("res"),
      onSwipe: (phase, dx, vel) => {
        const pages = Store.s.project.pages, i = pages.indexOf(pg);
        if (phase === "move") { stage.style.transform = "translate3d(" + (dx * 0.4) + "px,0,0)"; return; }
        stage.style.transition = "transform var(--t-3) var(--e-in)";
        setTimeout(() => { stage.style.transition = ""; }, 340);
        stage.style.transform = "";
        const commit = Math.abs(dx) > 70 || Math.abs(vel) > 0.45;
        if (!commit) return;
        const ni = clamp(i + (dx < 0 ? 1 : -1), 0, pages.length - 1);
        if (ni !== i) { haptic("select"); openInspector(pages[ni]); }
      }
    });
    renderCarousel();
    renderAdvanced();
  }
  /* Morph overlays between candidate layouts: match panels by best IoU and tween
     their rects, fading in/out the unmatched ones. Genuine morph, not a crossfade. */
  function drawOverlay(panels, instant) {
    const pg = inspectPage, svg = $("#stage2 svg");
    const from = displayed;
    const target = panels.map(p => ({ x: p.x, y: p.y, w: p.w, h: p.h, quad: p.quad || p.poly, conf: p.conf, order: p.order }));
    if (instant || !from || prefersReduced()) { paint(target, panels); displayed = target; return; }
    const pairs = target.map(t => {
      let best = null, bi = -1;
      from.forEach((f, i) => { const v = Workers.localCore.iou(f, t); if (v > 0.25 && (!best || v > best.v)) { best = { v }; bi = i; } });
      return bi >= 0 ? from[bi] : { x: t.x + t.w / 2, y: t.y + t.h / 2, w: 1, h: 1 };
    });
    const t0 = nowMs(), dur = 320;
    const step = () => {
      const k = clamp((nowMs() - t0) / dur, 0, 1);
      const e = 1 - Math.pow(1 - k, 3);
      const mid = target.map((t, i) => ({
        x: lerp(pairs[i].x, t.x, e), y: lerp(pairs[i].y, t.y, e),
        w: lerp(pairs[i].w, t.w, e), h: lerp(pairs[i].h, t.h, e),
        conf: t.conf, order: t.order
      }));
      paint(mid, null);
      if (k < 1) raf(step); else { paint(target, panels); displayed = target; }
    };
    raf(step);
    function paint(list, real) {
      const fs = Math.max(12, Math.min(pg.rectW, pg.rectH) * 0.055);
      svg.innerHTML =
        '<defs><linearGradient id="pgr" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0" stop-color="#6366F1" stop-opacity=".26"/><stop offset="1" stop-color="#A855F7" stop-opacity=".14"/>' +
        "</linearGradient></defs>" +
        list.map((p, i) => {
          const q = (real && (real[i].quad || real[i].poly)) || Workers.localCore.quadOf(p);
          const pts = q.map(a => a[0].toFixed(1) + "," + a[1].toFixed(1)).join(" ");
          const sel = inspSel.indexOf(i) >= 0;
          const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
          return '<polygon class="qpoly" data-i="' + i + '" points="' + pts + '" fill="url(#pgr)" stroke="' +
            (sel ? "#A855F7" : "#8B5CF6") + '" stroke-width="' + (sel ? 4 : 2) + '"/>' +
            '<circle cx="' + cx + '" cy="' + cy + '" r="' + (fs * 0.92) + '" fill="rgba(8,9,12,.74)"/>' +
            '<text x="' + cx + '" y="' + (cy + fs * 0.34) + '" font-size="' + fs + '" fill="#fff" text-anchor="middle" font-weight="700">' +
            ((p.order === undefined ? i : p.order) + 1) + "</text>";
        }).join("") + (advOpen ? handleMarkup(list) : "");
      if (advOpen) wireHandles();
      $$("polygon.qpoly", svg).forEach(el => {
        el.addEventListener("pointerdown", (ev) => {
          if (!advOpen) return;
          ev.stopPropagation();
          const i = +el.dataset.i;
          const at = inspSel.indexOf(i);
          if (at >= 0) inspSel.splice(at, 1); else inspSel.push(i);
          haptic("select"); drawOverlay(inspectPage.panels, true); renderAdvanced();
        });
      });
    }
  }
  function renderCarousel() {
    const pg = inspectPage, el = $("#carou");
    const layouts = pg.layouts && pg.layouts.length ? pg.layouts : [{ engine: "current", score: pg.score, panels: pg.panels }];
    el.innerHTML = layouts.map((L, i) => {
      const wire = L.panels.map(p =>
        '<rect x="' + (p.x / pg.rectW * 100).toFixed(1) + '" y="' + (p.y / pg.rectH * 100).toFixed(1) +
        '" width="' + (p.w / pg.rectW * 100).toFixed(1) + '" height="' + (p.h / pg.rectH * 100).toFixed(1) +
        '" fill="rgba(139,92,246,.18)" stroke="#8B5CF6" stroke-width="1.4" vector-effect="non-scaling-stroke"/>').join("");
      return '<button class="lay" data-i="' + i + '" aria-pressed="' + (i === pg.layoutIndex) + '" ' +
        'aria-label="' + esc(L.engine) + " layout, " + L.panels.length + " panels, score " + Math.round(L.score * 100) + ' percent">' +
        '<svg viewBox="0 0 100 100" preserveAspectRatio="none">' + wire + "</svg>" +
        "<span>" + esc(L.engine.length > 11 ? L.engine.slice(0, 10) + "…" : L.engine) + "<br>" +
        L.panels.length + "p · " + Math.round(L.score * 100) + "%</span></button>";
    }).join("");
    $$(".lay", el).forEach(b => b.addEventListener("click", () => {
      const i = +b.dataset.i;
      pg.layoutIndex = i;
      const L = layouts[i];
      pushUndo(pg);
      pg.panels = L.panels.map(p => Object.assign({}, p, {
        quadW: p.quadW || (p.quad || p.poly || Workers.localCore.quadOf(p)),
        conf: p.conf === undefined ? Math.min(0.95, L.score) : p.conf,
        sel: (p.conf === undefined ? L.score : p.conf) >= CONFIG.CONF_SELECT
      }));
      pg.score = L.score;
      ReadingOrder.order(pg, Store.s.project.rtl);
      reindexGlobal();
      inspSel = [];
      $$(".lay", el).forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      $("#isub").textContent = pg.panels.length + " panels · score " + Math.round(pg.score * 100) + "% · " + L.engine;
      haptic("toggle");
      drawOverlay(pg.panels, false);
      renderAdvanced();
      Persist.schedule();
      thumbCache.clear();
    }));
    const act = $('.lay[aria-pressed="true"]', el);
    if (act) act.scrollIntoView({ inline: "center", block: "nearest", behavior: "auto" });
  }
  /* ---- Advanced drawer: the escape hatch a normal user never opens ---- */
  let advOpen = false;
  function renderAdvanced() {
    const d = $("#advdrawer"), pg = inspectPage;
    d.hidden = !advOpen;
    $("#b-adv").setAttribute("aria-pressed", String(advOpen));
    if (!advOpen) { drawOverlayIfNeeded(); return; }
    const canMerge = inspSel.length >= 2, canOne = inspSel.length === 1;
    d.innerHTML = '<div class="group" style="margin-top:var(--sp-3)">' +
      '<div class="row"><div class="grow"><div class="lab">Manual correction</div>' +
      '<div class="sub">' + (inspSel.length ? inspSel.length + " selected -- drag the corner handles" : "Tap a panel to select it") + "</div></div></div></div>" +
      '<div style="display:flex;gap:var(--sp-2);flex-wrap:wrap">' +
      btn("add", "Add", "plus", false) + btn("del", "Delete", "trash", !inspSel.length) +
      btn("merge", "Merge", "merge", !canMerge) + btn("sh", "Split ―", null, !canOne) +
      btn("sv", "Split │", null, !canOne) +
      btn("undo", "Undo", "undo", !(pg._undo && pg._undo.length)) +
      btn("redo", "Redo", "redo", !(pg._redo && pg._redo.length)) + "</div>";
    $$("button[data-a]", d).forEach(b => b.addEventListener("click", () => advAction(b.dataset.a)));
    drawOverlay(pg.panels, true);
    function btn(a, label, icon, dis) {
      return '<button class="btn sm" data-a="' + a + '"' + (dis ? " disabled" : "") + ">" +
        (icon ? iconSvg(icon) : "") + esc(label) + "</button>";
    }
  }
  function drawOverlayIfNeeded() { if (inspectPage) drawOverlay(inspectPage.panels, true); }
  function handleMarkup(list) {
    const pg = inspectPage;
    const r = Math.max(6, Math.min(pg.rectW, pg.rectH) * 0.018);
    let out = "";
    for (const i of inspSel) {
      const p = list[i]; if (!p) continue;
      const cs = [[p.x, p.y, "nw"], [p.x + p.w, p.y, "ne"], [p.x + p.w, p.y + p.h, "se"], [p.x, p.y + p.h, "sw"]];
      for (const [x, y, k] of cs)
        out += '<circle class="hnd" data-i="' + i + '" data-k="' + k + '" cx="' + x + '" cy="' + y + '" r="' + r +
          '" fill="#A855F7" stroke="#fff" stroke-width="2" style="cursor:grab"/>';
    }
    return out;
  }
  function wireHandles() {
    const pg = inspectPage, svg = $("#stage2 svg");
    $$("circle.hnd", svg).forEach(h => {
      h.addEventListener("pointerdown", (e) => {
        e.stopPropagation(); e.preventDefault();
        const i = +h.dataset.i, k = h.dataset.k, p = pg.panels[i];
        if (!p) return;
        pushUndo(pg);
        const rect = svg.getBoundingClientRect();
        const sx = pg.rectW / rect.width, sy = pg.rectH / rect.height;
        const start = { x: p.x, y: p.y, w: p.w, h: p.h }, ox = e.clientX, oy = e.clientY;
        svg.setPointerCapture(e.pointerId);
        const move = (ev) => {
          const dx = (ev.clientX - ox) * sx, dy = (ev.clientY - oy) * sy;
          let x0 = start.x, y0 = start.y, x1 = start.x + start.w, y1 = start.y + start.h;
          if (k === "nw" || k === "sw") x0 += dx; else x1 += dx;
          if (k === "nw" || k === "ne") y0 += dy; else y1 += dy;
          p.x = clamp(Math.min(x0, x1), 0, pg.rectW - 8);
          p.y = clamp(Math.min(y0, y1), 0, pg.rectH - 8);
          p.w = clamp(Math.abs(x1 - x0), 8, pg.rectW - p.x);
          p.h = clamp(Math.abs(y1 - y0), 8, pg.rectH - p.y);
          p.quad = undefined; p.poly = undefined;
          p.quadW = Workers.localCore.quadOf(p);
          drawOverlay(pg.panels, true);
        };
        const up = () => {
          svg.removeEventListener("pointermove", move);
          svg.removeEventListener("pointerup", up);
          svg.removeEventListener("pointercancel", up);
          p.conf = Math.max(p.conf || 0, 0.9);
          ReadingOrder.order(pg, Store.s.project.rtl); reindexGlobal();
          thumbCache.delete(pg.id + ":" + i);
          Persist.schedule(); haptic("select");
          drawOverlay(pg.panels, true);
        };
        svg.addEventListener("pointermove", move, { passive: true });
        svg.addEventListener("pointerup", up);
        svg.addEventListener("pointercancel", up);
      });
    });
  }
  function pushUndo(pg) {
    pg._undo = pg._undo || []; pg._redo = [];
    pg._undo.push(JSON.stringify(pg.panels.map(p => ({ x: p.x, y: p.y, w: p.w, h: p.h, quad: p.quad, poly: p.poly, quadW: p.quadW, conf: p.conf, sel: p.sel }))));
    if (pg._undo.length > 30) pg._undo.shift();
  }
  function advAction(a) {
    const pg = inspectPage;
    if (a === "undo") {
      if (!pg._undo || !pg._undo.length) return;
      pg._redo = pg._redo || [];
      pg._redo.push(JSON.stringify(pg.panels));
      pg.panels = JSON.parse(pg._undo.pop());
    } else if (a === "redo") {
      if (!pg._redo || !pg._redo.length) return;
      pg._undo.push(JSON.stringify(pg.panels));
      pg.panels = JSON.parse(pg._redo.pop());
    } else {
      pushUndo(pg);
      if (a === "add") {
        const p = { x: pg.rectW * 0.32, y: pg.rectH * 0.36, w: pg.rectW * 0.36, h: pg.rectH * 0.24, conf: 0.9, sel: true };
        p.quadW = Workers.localCore.quadOf(p);
        pg.panels.push(p);
        inspSel = [pg.panels.length - 1];
      } else if (a === "del") {
        inspSel.slice().sort((x, y) => y - x).forEach(i => pg.panels.splice(i, 1));
        inspSel = [];
      } else if (a === "merge") {
        const sel = inspSel.map(i => pg.panels[i]).filter(Boolean);
        const x0 = Math.min.apply(null, sel.map(p => p.x)), y0 = Math.min.apply(null, sel.map(p => p.y));
        const x1 = Math.max.apply(null, sel.map(p => p.x + p.w)), y1 = Math.max.apply(null, sel.map(p => p.y + p.h));
        inspSel.slice().sort((x, y) => y - x).forEach(i => pg.panels.splice(i, 1));
        const m = { x: x0, y: y0, w: x1 - x0, h: y1 - y0, conf: 0.9, sel: true };
        m.quadW = Workers.localCore.quadOf(m);
        pg.panels.push(m);
        inspSel = [pg.panels.length - 1];
      } else if (a === "sh" || a === "sv") {
        const i = inspSel[0], p = pg.panels[i]; if (!p) return;
        const vert = a === "sv";
        const A = { x: p.x, y: p.y, w: vert ? p.w / 2 - 2 : p.w, h: vert ? p.h : p.h / 2 - 2, conf: 0.88, sel: true };
        const B = vert ? { x: p.x + p.w / 2 + 2, y: p.y, w: p.w / 2 - 2, h: p.h, conf: 0.88, sel: true }
          : { x: p.x, y: p.y + p.h / 2 + 2, w: p.w, h: p.h / 2 - 2, conf: 0.88, sel: true };
        A.quadW = Workers.localCore.quadOf(A); B.quadW = Workers.localCore.quadOf(B);
        pg.panels.splice(i, 1, A, B);
        inspSel = [];
      }
    }
    for (const p of pg.panels) if (!p.quadW) p.quadW = Workers.localCore.quadOf(p);
    ReadingOrder.order(pg, Store.s.project.rtl);
    reindexGlobal();
    thumbCache.clear();
    haptic("toggle");
    drawOverlay(pg.panels, true);
    renderAdvanced();
    $("#isub").textContent = pg.panels.length + " panels · edited";
    Persist.schedule();
  }
  function reindexGlobal() {
    let gi = 0;
    for (const pg of Store.s.project.pages) for (const p of pg.panels) p.gIndex = ++gi;
  }

    async function runExport(kind) {
      $("#xdest", wrap).hidden = true;
      $("#xprog", wrap).hidden = false;
      const bar = $("#xprog i", wrap), msg = $("#xmsg", wrap), num = $("#xn", wrap);
      const onProgress = (f, name) => {
        bar.style.width = (f * 100).toFixed(1) + "%";
        msg.textContent = name;
        num.textContent = Math.round(f * 100) + "%";
      };
      try {
        let n = 0;
        if (kind === "share") n = await Exporter.toShare(onProgress);
        else if (kind === "zip") n = await Exporter.toZip(onProgress);
        else if (kind === "dir") n = await Exporter.toDirectory(onProgress);
        else n = await Exporter.toDownloads(onProgress);
        $("#xprog", wrap).hidden = true;
        $("#xdone", wrap).hidden = false;
        $("#xdmsg", wrap).textContent = n + (n === 1 ? " panel exported" : " panels exported");
        haptic("success");
        Logger.info("export", "complete", { kind, count: n, preset: S.preset, format: S.format });
        setTimeout(() => sh.close(), 1500);
      } catch (e) {
        $("#xprog", wrap).hidden = true;
        $("#xdest", wrap).hidden = false;
        const aborted = e && (e.name === "AbortError" || /abort|cancel/i.test(String(e.message)));
        if (!aborted) {
          Logger.error("export", "failed", String(e && e.message || e));
          Comp.toast(e && e.message ? e.message : "Export failed -- see diagnostics.", { kind: "warn" });
          haptic("error");
        }
      }
    }
  }
  /* Sources are not stored (only hashes) -- ask the user to re-select and match. */
  function needRelink() {
    const wrap = document.createElement("div");
    wrap.innerHTML = '<p style="color:var(--txt-2);font-size:var(--f-13);padding-bottom:var(--sp-4)">' +
      "This session was restored, so the original page files aren't in memory. Panel data is intact -- " +
      "re-select the same images or archive and everything reconnects by content hash. No re-detection needed.</p>";
    const b = document.createElement("button");
    b.className = "btn pri wide"; b.textContent = "Choose source files";
    wrap.appendChild(b);
    const s = Comp.sheet({ title: "Reconnect sources", content: wrap });
    b.addEventListener("click", () => {
      const inp = document.createElement("input");
      inp.type = "file"; inp.multiple = true;
      inp.accept = "image/*,.pdf,.cbz,.zip,.acbf";
      inp.addEventListener("change", async () => {
        s.close();
        const n = await relink(Array.from(inp.files || []));
        if (n) { Comp.toast("Reconnected " + n + (n === 1 ? " page." : " pages."), { kind: "ok" }); updateExportCount(); }
        else Comp.toast("None of those files matched this project.", { kind: "warn" });
      });
      inp.click();
    });
  }
  async function relink(files) {
    const items = await Ingest.expand(files, () => { });
    let n = 0;
    for (const it of items) {
      const h = await hashBlob(it.blob);
      for (const pg of Store.s.project.pages) {
        if (pg.file) continue;
        if (pg.hash === h || pg.name.indexOf(it.name) === 0 || it.name === pg.name.replace(/ \((left|right)\)$/, "")) {
          pg.file = it.blob; n++;
        }
      }
      await nextFrame();
    }
    return n;
  }

  /* ---- diagnostics, including scorer separation evidence and buffer overlays ---- */
  function openDiagnostics() {
    const p = Store.s.project;
    const wrap = document.createElement("div");
    const seg = document.createElement("div");
    seg.className = "seg"; seg.setAttribute("role", "tablist"); seg.setAttribute("aria-label", "Diagnostics view");
    seg.innerHTML = '<span class="pill"></span>' +
      '<button role="tab" data-v="pages" aria-selected="true">Pages</button>' +
      '<button role="tab" data-v="engines" aria-selected="false">Engines</button>' +
      '<button role="tab" data-v="grid" aria-selected="false">Issue grid</button>' +
      '<button role="tab" data-v="log" aria-selected="false">Log</button>';
    wrap.appendChild(seg);
    const body = document.createElement("div");
    body.style.paddingTop = "var(--sp-3)";
    wrap.appendChild(body);
    const foot = document.createElement("div");
    foot.style.cssText = "display:flex;gap:var(--sp-2);padding:var(--sp-3) 0 var(--sp-4)";
    foot.innerHTML = '<button class="btn sm" id="dcopy">Copy diagnostics</button>' +
      '<button class="btn sm" id="dbuf">Debug overlay</button>';
    wrap.appendChild(foot);
    const sh = Comp.sheet({ title: "Diagnostics", content: wrap, noAutoFocus: true });
    Comp.initSeg(seg, render);
    render("pages");
    $("#dcopy", foot).addEventListener("click", async () => {
      const txt = diagText();
      try { await navigator.clipboard.writeText(txt); Comp.toast("Diagnostics copied.", { kind: "ok" }); }
      catch (e) { Exporter.downloadBlob(new Blob([txt], { type: "text/plain" }), "panelforge-diagnostics.txt"); }
    });
    $("#dbuf", foot).addEventListener("click", () => { sh.close(); openDebugOverlay(); });

    function render(v) {
      if (!p) { body.innerHTML = '<div class="diag">No project loaded.</div>'; return; }
      if (v === "pages") {
        // scorer evidence: winner vs next-best alternative on every page
        const rows = p.pages.map((pg, i) => {
          const alts = pg.layouts || [];
          const next = alts.length > 1 ? alts[1].score : 0;
          const sep = alts.length > 1 ? (pg.score - next) : null;
          const d = pg.diag || {};
          return "p" + pad2(i + 1) + "  " + String(pg.panels.length).padStart(2) + "pnl  " +
            "score " + (pg.score || 0).toFixed(3) +
            (sep !== null ? "  next " + next.toFixed(3) + "  Δ" + (sep >= 0 ? "+" : "") + sep.toFixed(3) : "") +
            (d.consensus ? "  consensus " + (d.consensus.delta >= 0 ? "+" : "") + d.consensus.delta.toFixed(3) + " (" + d.consensus.used + ")" : "") +
            (d.neural ? "  neural " + (d.neural.accepted ? "used" : "rejected") : "") +
            (d.cloud ? "  cloud " + (d.cloud.accepted ? "used" : "rejected") : "") +
            "  " + (d.ms || 0) + "ms  " + (d.evals || 0) + " evals  " + (d.polarity || "") +
            (d.dropped ? "  dropped " + d.dropped : "") +
            (pg.params ? "\n      params gutter=" + pg.params.gutterFrac.toFixed(3) +
              " partial=" + pg.params.partialCut.toFixed(2) + " edge=" + pg.params.edgeThresh.toFixed(3) +
              " lineGap=" + pg.params.lineGapFrac.toFixed(3) + " seam=" + pg.params.seamSens.toFixed(2) +
              " bin=" + ["otsu", "adaptive", "sauvola"][pg.params.binVariant] : "") +
            (d.terms ? "\n      terms " + Object.keys(d.terms).map(k => k + "=" + (+d.terms[k]).toFixed(2)).join(" ") : "");
        }).join("\n");
        const seps = p.pages.map(pg => (pg.layouts && pg.layouts.length > 1) ? pg.score - pg.layouts[1].score : null).filter(x => x !== null);
        const meanSep = seps.length ? seps.reduce((a, b) => a + b, 0) / seps.length : 0;
        body.innerHTML = '<div class="diag">' + esc(
          "SCORER SEPARATION -- winning layout vs next-best alternative\n" +
          "mean Δ " + meanSep.toFixed(3) + " over " + seps.length + " pages with alternatives\n" +
          "(a positive Δ on every page means the scorer ranks the chosen interpretation above\n" +
          " the competing ones it also generated -- this is the evidence it discriminates)\n\n" + rows) + "</div>";
      } else if (v === "engines") {
        const w = p.weights || {};
        const agg = {};
        for (const pg of p.pages) {
          const t = (pg.diag && pg.diag.engineMs) || {}, c = (pg.diag && pg.diag.counts) || {};
          for (const k in t) { agg[k] = agg[k] || { ms: 0, n: 0, panels: 0, pages: 0 }; agg[k].ms += t[k] || 0; agg[k].n++; }
          for (const k in c) { agg[k] = agg[k] || { ms: 0, n: 0, panels: 0, pages: 0 }; agg[k].panels += c[k] || 0; if (c[k]) agg[k].pages++; }
        }
        const lines = Object.keys(agg).sort().map(k =>
          k.padEnd(9) + " reliability " + (w[k] === undefined ? 1 : w[k]).toFixed(3) +
          "  total " + agg[k].ms + "ms  avg " + (agg[k].ms / Math.max(1, agg[k].n)).toFixed(1) + "ms" +
          "  proposals " + agg[k].panels + " on " + agg[k].pages + " pages");
        const mem = performance.memory ? "\n\nJS heap " + fmtBytes(performance.memory.usedJSHeapSize) + " / limit " + fmtBytes(performance.memory.jsHeapSizeLimit) : "";
        body.innerHTML = '<div class="diag">' + esc(
          "PER-ENGINE RELIABILITY (EMA across this project, rate " + CONFIG.ENGINE_EMA + ")\n" +
          "Every engine listed produced proposals -- none returns empty.\n\n" + lines.join("\n") +
          "\n\nexecution path " + (Workers.available ? "blob workers ×" + Workers.size : "yielding main thread") +
          "\nworking cap " + (Store.s.adaptiveCap || CONFIG.WORK_EDGE) + "px" +
          (Store.s.slowDevice ? " (slow device: reduced budget, watershed skipped)" : "") +
          "\nneural " + Neural.state + " · cloud " + (Cloud.enabled() ? "enabled" : "off") + mem) + "</div>";
      } else if (v === "grid") {
        const g = p.grid;
        if (!g) { body.innerHTML = '<div class="diag">No stable issue grid was recovered -- pages were solved independently.</div>'; return; }
        const wire = '<svg viewBox="0 0 100 140" style="width:100%;max-width:220px;background:var(--surf-3);border-radius:var(--r-2);display:block;margin:0 auto var(--sp-3)">' +
          g.cols.map(c => '<line x1="' + (c * 100).toFixed(1) + '" y1="0" x2="' + (c * 100).toFixed(1) + '" y2="140" stroke="#8B5CF6" stroke-width=".6"/>').join("") +
          g.rows.map(r => '<line x1="0" y1="' + (r * 140).toFixed(1) + '" x2="100" y2="' + (r * 140).toFixed(1) + '" stroke="#6366F1" stroke-width=".6"/>').join("") +
          "</svg>";
        const improved = p.pages.filter(pg => pg.diag && pg.diag.consensus && pg.diag.consensus.delta > 0);
        body.innerHTML = wire + '<div class="diag">' + esc(
          "LEARNED ISSUE GRID (normalised page space)\n" +
          "columns " + g.cols.map(c => c.toFixed(3)).join(" ") + "\n" +
          "rows    " + g.rows.map(r => r.toFixed(3)).join(" ") + "\n" +
          "margins L" + g.margins.left.toFixed(3) + " R" + g.margins.right.toFixed(3) +
          " T" + g.margins.top.toFixed(3) + " B" + g.margins.bottom.toFixed(3) + "\n" +
          "canonical gutter " + g.gutter.toFixed(4) + " · learned from " + g.samples + " panels\n\n" +
          "CONSENSUS RE-RUN DELTAS\n" +
          (improved.length ? improved.map(pg =>
            pg.name + "  " + (pg.score0 || 0).toFixed(3) + " → " + pg.score.toFixed(3) +
            "  (+" + pg.diag.consensus.delta.toFixed(3) + ", via " + pg.diag.consensus.used + ")").join("\n")
            : "no weak page improved beyond the acceptance margin")) + "</div>";
      } else {
        body.innerHTML = '<div class="diag">' + esc(Logger.text()) + "</div>";
      }
    }
    function diagText() {
      const ua = navigator.userAgent;
      return "PanelForge diagnostics\n" + new Date().toISOString() + "\n" + ua +
        "\nviewport " + innerWidth + "x" + innerHeight + " dpr" + (devicePixelRatio || 1) +
        "\ncores " + (navigator.hardwareConcurrency || "?") + " · workers " + (Workers.available ? Workers.size : 0) +
        " · webgpu " + (!!navigator.gpu) + " · idb " + DB.available +
        "\nneural " + Neural.state + " · cloud " + (Cloud.enabled() ? "on" : "off") +
        "\n\n" + (p ? p.pages.map((pg, i) => "p" + pad2(i + 1) + " " + pg.name + " " + pg.panels.length + "pnl score " +
          (pg.score || 0).toFixed(3) + " " + safeJson(pg.diag || {})).join("\n") : "no project") +
        "\n\n" + Logger.text();
    }
  }

  /* Debug overlay: render the actual intermediate buffers over a page. Uses the
     same pure core the pipeline uses, so what you see is what the engines saw. */
  function openDebugOverlay() {
    const p = Store.s.project;
    if (!p || !p.pages.length) { Comp.toast("Load pages first.", { kind: "info" }); return; }
    let pageIdx = 0, buf = "mask", ctxCache = null;
    const wrap = document.createElement("div");
    wrap.innerHTML =
      '<div class="chips" style="padding:0 0 var(--sp-3)" id="dbufs"></div>' +
      '<canvas id="dcv" style="width:100%;border-radius:var(--r-2);background:var(--surf-3);display:block"></canvas>' +
      '<div class="foot" id="dnote" style="padding:var(--sp-3) 0 0"></div>' +
      '<div style="display:flex;gap:var(--sp-2);padding-top:var(--sp-2)">' +
      '<button class="btn sm" id="dprev">Previous page</button><button class="btn sm" id="dnext">Next page</button></div>';
    const sh = Comp.sheet({ title: "Debug buffers", content: wrap, noAutoFocus: true });
    const buffers = ["gray", "bin", "mask", "edges", "balloons", "edt", "segments", "seam"];
    $("#dbufs", wrap).innerHTML = buffers.map(b =>
      '<button class="chip" data-b="' + b + '" aria-pressed="' + (b === buf) + '">' + b + "</button>").join("");
    $$("[data-b]", wrap).forEach(b => b.addEventListener("click", () => {
      buf = b.dataset.b;
      $$("[data-b]", wrap).forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      paint();
    }));
    $("#dprev", wrap).addEventListener("click", () => { pageIdx = Math.max(0, pageIdx - 1); ctxCache = null; paint(); });
    $("#dnext", wrap).addEventListener("click", () => { pageIdx = Math.min(p.pages.length - 1, pageIdx + 1); ctxCache = null; paint(); });
    paint();

    async function paint() {
      const pg = p.pages[pageIdx];
      const note = $("#dnote", wrap);
      note.textContent = "Computing " + buf + " for " + pg.name + "…";
      const core = Workers.localCore;
      try {
        if (!ctxCache) {
          let src;
          if (pg.file) src = await Img.decode(pg.file);
          else src = await Img.decode(pg.thumbBlob);          // restored session: thumb is enough for a visual
          const sc = pg.file ? pg.scale : 1;
          const W = Math.max(16, Math.round((pg.file ? pg.crop.w : (src.width || src.naturalWidth)) * sc));
          const H = Math.max(16, Math.round((pg.file ? pg.crop.h : (src.height || src.naturalHeight)) * sc));
          const cv = pg.file
            ? Img.drawScaled(src, pg.crop.x, pg.crop.y, pg.crop.w, pg.crop.h, W, H, pg.orient)
            : Img.drawScaled(src, 0, 0, src.width || src.naturalWidth, src.height || src.naturalHeight, W, H, 1);
          if (src.close) { try { src.close(); } catch (e) { } }
          const id = cv.getContext("2d", { alpha: false }).getImageData(0, 0, W, H);
          Img.release(cv);
          const pre = core.preprocess(id.data, W, H, {});
          const prep = core.makePolarity(pre, (pg.polarity || "dark").indexOf("dark") === 0);
          const c = core.buildCtx(prep, pg.params || CONFIG.P);
          ctxCache = { c, prep };
        }
        const { c, prep } = ctxCache;
        const cv = $("#dcv", wrap);
        cv.width = c.W; cv.height = c.H;
        const cx = cv.getContext("2d");
        const id = cx.createImageData(c.W, c.H), d = id.data;
        const put = (i, r, g, b) => { d[i * 4] = r; d[i * 4 + 1] = g; d[i * 4 + 2] = b; d[i * 4 + 3] = 255; };
        if (buf === "gray") for (let i = 0; i < c.W * c.H; i++) { const v = clamp(c.gray[i] | 0, 0, 255); put(i, v, v, v); }
        else if (buf === "bin") for (let i = 0; i < c.W * c.H; i++) { const v = c.bin[i] ? 20 : 240; put(i, v, v, v); }
        else if (buf === "mask") for (let i = 0; i < c.W * c.H; i++) c.mask[i] ? put(i, 139, 92, 246) : put(i, 16, 18, 24);
        else if (buf === "edges") for (let i = 0; i < c.W * c.H; i++) c.edge[i] ? put(i, 52, 211, 153) : put(i, 12, 14, 18);
        else if (buf === "balloons") for (let i = 0; i < c.W * c.H; i++) {
          if (prep.balloons[i]) put(i, 251, 191, 36);
          else if (c.bin[i]) put(i, 60, 64, 78); else put(i, 14, 16, 20);
        }
        else if (buf === "edt") {
          // display-only chamfer distance transform (the engines use the exact
          // Felzenszwalb EDT; this is just for visualisation)
          const dt = chamfer(c.mask, c.W, c.H);
          let mx = 1; for (let i = 0; i < dt.length; i++) if (dt[i] > mx) mx = dt[i];
          for (let i = 0; i < dt.length; i++) {
            const t = dt[i] / mx;
            put(i, Math.round(30 + t * 130), Math.round(20 + t * 70), Math.round(60 + t * 190));
          }
        } else if (buf === "segments") {
          for (let i = 0; i < c.W * c.H; i++) put(i, 12, 14, 18);
          cx.putImageData(id, 0, 0);
          drawSegments(cx, c);
          note.textContent = pg.name + " · long H/V edge runs feeding the line-graph engine (green horizontal, indigo vertical)";
          return;
        } else if (buf === "seam") {
          for (let i = 0; i < c.W * c.H; i++) put(i, 12, 14, 18);
          cx.putImageData(id, 0, 0);
          drawSeam(cx, c);
          note.textContent = pg.name + " · column and row ink/edge projections -- the seam engine's peak search space";
          return;
        }
        cx.putImageData(id, 0, 0);
        note.textContent = pg.name + " · " + c.W + "×" + c.H + " working px · " + buf +
          (buf === "balloons" ? " -- amber regions are erased from detection only, never from the export" : "");
      } catch (e) {
        note.textContent = "Couldn't build that buffer: " + (e.message || e);
        Logger.warn("diag", "debug buffer failed", String(e.message || e));
      }
    }
    function chamfer(mask, W, H) {
      const INF = 1e9, d = new Float32Array(W * H);
      for (let i = 0; i < d.length; i++) d[i] = mask[i] ? INF : 0;
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const i = y * W + x; let v = d[i];
        if (x > 0) v = Math.min(v, d[i - 1] + 1);
        if (y > 0) v = Math.min(v, d[i - W] + 1);
        if (x > 0 && y > 0) v = Math.min(v, d[i - W - 1] + 1.414);
        if (x < W - 1 && y > 0) v = Math.min(v, d[i - W + 1] + 1.414);
        d[i] = v;
      }
      for (let y = H - 1; y >= 0; y--) for (let x = W - 1; x >= 0; x--) {
        const i = y * W + x; let v = d[i];
        if (x < W - 1) v = Math.min(v, d[i + 1] + 1);
        if (y < H - 1) v = Math.min(v, d[i + W] + 1);
        if (x < W - 1 && y < H - 1) v = Math.min(v, d[i + W + 1] + 1.414);
        if (x > 0 && y < H - 1) v = Math.min(v, d[i + W - 1] + 1.414);
        d[i] = v;
      }
      return d;
    }
    function drawSegments(cx, c) {
      cx.lineWidth = 1.4;
      const minH = c.W * 0.22, minV = c.H * 0.22;
      cx.strokeStyle = "#34D399";
      for (let y = 0; y < c.H; y += 2) {
        let s = -1;
        for (let x = 0; x <= c.W; x++) {
          const on = x < c.W && c.edge[y * c.W + x];
          if (on && s < 0) s = x;
          else if (!on && s >= 0) { if (x - s >= minH) { cx.beginPath(); cx.moveTo(s, y); cx.lineTo(x, y); cx.stroke(); } s = -1; }
        }
      }
      cx.strokeStyle = "#818CF8";
      for (let x = 0; x < c.W; x += 2) {
        let s = -1;
        for (let y = 0; y <= c.H; y++) {
          const on = y < c.H && c.edge[y * c.W + x];
          if (on && s < 0) s = y;
          else if (!on && s >= 0) { if (y - s >= minV) { cx.beginPath(); cx.moveTo(x, s); cx.lineTo(x, y); cx.stroke(); } s = -1; }
        }
      }
    }
    function drawSeam(cx, c) {
      const colH = new Float32Array(c.W), rowH = new Float32Array(c.H);
      for (let y = 0; y < c.H; y++) for (let x = 0; x < c.W; x++) {
        const v = c.mask[y * c.W + x] + c.edge[y * c.W + x] * 1.5;
        colH[x] += v; rowH[y] += v;
      }
      let mc = 1, mr = 1;
      for (let x = 0; x < c.W; x++) if (colH[x] > mc) mc = colH[x];
      for (let y = 0; y < c.H; y++) if (rowH[y] > mr) mr = rowH[y];
      cx.strokeStyle = "#A855F7"; cx.lineWidth = 1.6;
      cx.beginPath();
      for (let x = 0; x < c.W; x++) { const y = c.H - (colH[x] / mc) * c.H * 0.42; x ? cx.lineTo(x, y) : cx.moveTo(x, y); }
      cx.stroke();
      cx.strokeStyle = "#60A5FA";
      cx.beginPath();
      for (let y = 0; y < c.H; y++) { const x = (rowH[y] / mr) * c.W * 0.42; y ? cx.lineTo(x, y) : cx.moveTo(x, y); }
      cx.stroke();
    }
  }

  /* ---- minimised processing bar ("Run in background") ---- */
  let mini = null;
  function minimize() {
    if (mini) return;
    mini = document.createElement("button");
    mini.id = "minibar";
    mini.style.cssText = "position:fixed;left:max(12px,var(--safe-l));right:max(12px,var(--safe-r));" +
      "top:calc(var(--safe-t) + 8px);z-index:35;display:flex;align-items:center;gap:12px;padding:10px 14px;" +
      "border-radius:var(--r-3);background:var(--surf-glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);" +
      "border:1px solid var(--line-strong);box-shadow:var(--sh-2);text-align:left";
    mini.setAttribute("aria-label", "Return to processing");
    mini.innerHTML = '<span style="flex:1;font-size:var(--f-13);font-weight:600" id="mtxt">Extracting…</span>' +
      '<span class="mono" style="font-size:var(--f-13);color:var(--a3)" id="mpct">0%</span>';
    mini.addEventListener("click", () => { unminimize(); show("proc"); });
    document.body.appendChild(mini);
    showResults();
  }
  function unminimize() { if (mini) { mini.remove(); mini = null; } }
  function syncMini() {
    if (!mini) return;
    const s = Pipeline.stats;
    $("#mtxt", mini).textContent = s.stage || ("Extracting " + s.done + "/" + s.pages);
    $("#mpct", mini).textContent = Math.round(s.pages ? (s.done / s.pages) * 100 : 0) + "%";
  }

  function showLaunch() {
    unminimize();
    show("launch");
    renderCaps();
    refreshResume();
  }
  async function refreshResume() {
    const id = await Persist.lastId();
    const b = $("#b-resume");
    if (!id) { b.hidden = true; return; }
    const p = await DB.get("projects", id);
    if (!p) { b.hidden = true; return; }
    b.hidden = false;
    b.textContent = "Resume "" + p.name + """;
    b.onclick = async () => {
      const loaded = await Persist.load(id);
      if (!loaded) { Comp.toast("That session couldn't be restored.", { kind: "warn" }); return; }
      Store.s.project = loaded;
      for (const pg of loaded.pages) for (const q of pg.panels) if (!q.quadW) q.quadW = Workers.localCore.quadOf(q);
      reindexGlobal();
      thumbCache.clear();
      showResults();
      Comp.toast("Session restored. Reconnect the source files when you export.", { kind: "info", ms: 5000 });
    };
  }
  function applyTheme() {
    const t = Store.s.settings.theme;
    const dark = t === "dark" || (t === "auto" && !matchMedia("(prefers-color-scheme: light)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    const meta = $('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", dark ? "#08090C" : "#F6F7FB");
  }
  return {
    show, showLaunch, showProcessing, showResults, renderResults, renderCaps, refreshResume,
    setProgress, setStage: (t, s) => { Pipeline.stats.stage = t; setStage(t, s); syncMini(); },
    setStats: () => { setStats(); syncMini(); },
    addQueueCard, updateQueueCard, updateExportCount, openInspector, openExport, openSettings,
    openProjects, openDiagnostics, applyTheme, minimize, unminimize, relink,
    toast: (m, o) => Comp.toast(m, o),
    get current() { return current; },
    thumbCache
  };
})();

/* ============================================================================
 * IMPORT FLOW -- files, folder drop, clipboard paste. Processing starts
 * immediately; there is no Start button and no settings prompt.
 * ========================================================================== */
async function startImport(files) {
  if (Pipeline.running) { Comp.toast("Already extracting -- cancel first.", { kind: "info" }); return; }
  if (!files || !files.length) return;
  if (!Store.s.project || Store.s.project.pages.length) {
    const base = (files[0].name || "Issue").replace(/\.[^.]+$/, "").replace(/[_\-]+/g, " ").trim();
    Store.newProject(base.slice(0, 46) || "Untitled issue");
  }
  const p = Store.s.project;
  UI.show("proc");
  UI.setStage("Reading files", files.length + (files.length === 1 ? " file" : " files"));
  UI.setProgress(0.02);
  const items = await Ingest.expand(Array.from(files), (msg, kind) => Comp.toast(msg, { kind: kind === "ok" ? "ok" : kind === "warn" ? "warn" : "info" }));
  if (!items.length) {
    Comp.toast("Nothing importable in that selection.", { kind: "warn" });
    UI.showLaunch();
    return;
  }
  if (items.length > CONFIG.MAX_PAGES) {
    Comp.toast("Importing the first " + CONFIG.MAX_PAGES + " pages of " + items.length + ".", { kind: "info" });
    items.length = CONFIG.MAX_PAGES;
  }
  // apply a standalone ACBF dropped alongside the images, matched by filename
  const pending = Store.s.acbfPending;
  if (pending) {
    for (const it of items) {
      const m = pending.find(e => e.href && it.name && (it.name === e.href || it.name.indexOf(e.href.replace(/^#/, "")) >= 0));
      if (m && m.frames.length) it.frames = m.frames;
    }
    Store.s.acbfPending = null;
  }
  const added = [];
  UI.setStage("Preparing pages", items.length + " pages");
  for (let i = 0; i < items.length; i++) {
    const pages = await Ingest.makePages(items[i], (msg, kind) => Comp.toast(msg, { kind: kind === "warn" ? "warn" : "info" }));
    for (const pg of pages) {
      p.pages.push(pg); added.push(pg);
      Persist.putThumb(p.id, pg.id, pg.thumbBlob).catch(() => { });
    }
    UI.setProgress(0.02 + 0.12 * ((i + 1) / items.length));
    await nextFrame();
  }
  if (!added.length) { Comp.toast("No usable pages found.", { kind: "warn" }); UI.showLaunch(); return; }
  Logger.info("ingest", "imported", { files: files.length, pages: added.length });
  await Persist.save();
  UI.refreshResume();
  Pipeline.run(added);
}

/* recursive folder drop via the entries API */
async function filesFromDataTransfer(dt) {
  const out = [];
  const items = dt.items ? Array.from(dt.items) : [];
  const entries = items.map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (entries.length) {
    for (const e of entries) await walk(e);
    if (out.length) return out;
  }
  return Array.from(dt.files || []);
  async function walk(entry, depth) {
    if ((depth || 0) > 6 || out.length > CONFIG.MAX_PAGES * 3) return;
    if (entry.isFile) {
      const f = await new Promise(r => entry.file(r, () => r(null)));
      if (f) out.push(f);
    } else if (entry.isDirectory) {
      const rd = entry.createReader();
      for (; ;) {
        const batch = await new Promise(r => rd.readEntries(r, () => r([])));
        if (!batch.length) break;
        for (const c of batch) await walk(c, (depth || 0) + 1);
      }
    }
  }
}

/* ============================================================================
 * BOOTSTRAP -- wiring, global error boundary, keyboard shortcuts.
 * ========================================================================== */
(function bootstrap() {
  UI.applyTheme();
  matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => {
    if (Store.s.settings.theme === "auto") UI.applyTheme();
  });

  /* global boundary: never a white screen; the session is preserved */
  let crashed = false;
  function crash(what, err) {
    Logger.error("fatal", what, String(err && (err.stack || err.message) || err));
    if (crashed) return;
    crashed = true;
    $("#crmsg").textContent = (err && err.message ? err.message : String(err)) +
      " -- your pages and panels are still in memory and the last autosave is intact.";
    $("#crash").classList.add("on");
    $("#b-crclose").focus({ preventScroll: true });
  }
  window.addEventListener("error", (e) => { if (e && e.message) crash("onerror", e.error || new Error(e.message)); });
  window.addEventListener("unhandledrejection", (e) => { crash("unhandledrejection", e.reason || new Error("promise rejected")); });
  $("#b-crclose").addEventListener("click", () => { $("#crash").classList.remove("on"); crashed = false; });
  $("#b-crcopy").addEventListener("click", async () => {
    const txt = "PanelForge crash report\n" + navigator.userAgent + "\n\n" + Logger.text();
    try { await navigator.clipboard.writeText(txt); Comp.toast("Diagnostics copied.", { kind: "ok" }); }
    catch (e) { Exporter.downloadBlob(new Blob([txt], { type: "text/plain" }), "panelforge-crash.txt"); }
  });

  // launch
  $("#b-import").addEventListener("click", () => { haptic("select"); $("#fin").click(); });
  $("#b-settings").addEventListener("click", () => UI.openSettings());
  $("#b-projects").addEventListener("click", () => UI.openProjects());
  $("#fin").addEventListener("change", () => {
    const f = Array.from($("#fin").files || []);
    $("#fin").value = "";
    startImport(f);
  });
  $("#fmodel").addEventListener("change", async () => {
    const f = ($("#fmodel").files || [])[0];
    $("#fmodel").value = "";
    if (!f) return;
    const st = await Neural.installModel(f);
    UI.renderCaps();
    Comp.toast(st === "ready" ? "Neural model installed and active."
      : "Model stored, but the ONNX runtime isn't embedded in this file -- the classical ensemble continues at full capability.",
      { kind: st === "ready" ? "ok" : "info", ms: 6000 });
  });

  // processing
  $("#b-cancel").addEventListener("click", async () => {
    if (!Pipeline.running) { UI.showLaunch(); return; }
    if (await Comp.confirm({ title: "Cancel extraction?", danger: true, confirm: "Cancel", message: "Pages already finished are kept and saved." })) {
      Pipeline.cancel();
    }
  });
  $("#b-bg").addEventListener("click", () => { haptic("select"); UI.minimize(); });

  // results
  $("#b-home").addEventListener("click", () => UI.showLaunch());
  $("#b-diag").addEventListener("click", () => UI.openDiagnostics());
  $("#b-export").addEventListener("click", () => { haptic("select"); UI.openExport(); });
  $("#b-smart").addEventListener("click", () => {
    const n = Exporter.smartSelect();
    UI.renderResults(); UI.updateExportCount(); Persist.schedule(); haptic("toggle");
    Comp.toast(n + " panels picked -- balanced for confidence, variety and story coverage.", { kind: "ok" });
  });

  // inspector
  $("#b-iback").addEventListener("click", () => UI.show("res"));
  $("#b-adv").addEventListener("click", () => {
    const pressed = $("#b-adv").getAttribute("aria-pressed") === "true";
    $("#b-adv").setAttribute("aria-pressed", String(!pressed));
    // toggle handled inside the UI module via the same flag
    const evt = new CustomEvent("pf-adv", { detail: !pressed });
    document.dispatchEvent(evt);
  });

  // drag & drop anywhere
  let dragDepth = 0;
  const drop = $("#drop");
  window.addEventListener("dragenter", (e) => { e.preventDefault(); if (++dragDepth === 1) drop.classList.add("on"); });
  window.addEventListener("dragover", (e) => { e.preventDefault(); });
  window.addEventListener("dragleave", (e) => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; drop.classList.remove("on"); } });
  window.addEventListener("drop", async (e) => {
    e.preventDefault(); dragDepth = 0; drop.classList.remove("on");
    const files = await filesFromDataTransfer(e.dataTransfer);
    if (files.length) startImport(files);
  });
  // clipboard paste
  window.addEventListener("paste", (e) => {
    if (/input|textarea/i.test((e.target && e.target.tagName) || "")) return;
    const files = Array.from((e.clipboardData && e.clipboardData.files) || []);
    if (files.length) { e.preventDefault(); startImport(files); }
  });

  // keyboard shortcuts (desktop convenience; every control is also tabbable)
  window.addEventListener("keydown", (e) => {
    if (/input|textarea/i.test((e.target && e.target.tagName) || "")) return;
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "o") { e.preventDefault(); $("#fin").click(); }
    else if (e.key === "Escape" && UI.current === "insp") UI.show("res");
    else if (e.key.toLowerCase() === "e" && UI.current === "res") UI.openExport();
    else if (e.key.toLowerCase() === "s" && UI.current === "res") $("#b-smart").click();
  });

  // only warn while actually working
  window.addEventListener("beforeunload", (e) => {
    if (!Pipeline.running) return;
    e.preventDefault(); e.returnValue = "";
  });

  // capability probe in the background -- never blocks first paint
  raf(() => {
    UI.renderCaps();
    UI.refreshResume();
    setTimeout(() => {
      Workers.probe().then(() => UI.renderCaps());
      Neural.init().then(() => UI.renderCaps());
    }, 120);
  });
  Logger.info("boot", "ready", {
    ua: navigator.userAgent.slice(0, 90), cores: navigator.hardwareConcurrency || 0,
    webgpu: !!navigator.gpu, idb: DB.available, dpr: devicePixelRatio || 1,
    viewport: innerWidth + "x" + innerHeight
  });
})();

/* Advanced-drawer toggle bridge: the UI module owns the flag, the button lives in
   the shell. A custom event keeps the module DOM-agnostic about the header. */
document.addEventListener("pf-adv", (e) => {
  const open = !!e.detail;
  // re-enter the module through its public surface
  const pressed = $("#b-adv");
  pressed.setAttribute("aria-pressed", String(open));
  const drawer = $("#advdrawer");
  drawer.hidden = !open;
  // rebuild by reopening the inspector on the same page (cheap: thumbnails only)
  const label = $("#it").textContent;
  const pg = Store.s.project && Store.s.project.pages.find(p => p.name === label);
  if (pg) { window.__pfAdv = open; UI.openInspector(pg); }
  if (open) Comp.toast("Advanced editing on -- tap a panel, then drag its corners.", { kind: "info", once: "adv" });
});
</script>
</body>
