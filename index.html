.presets{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin-bottom:var(--sp-4)}
.pset{border-radius:var(--r-3);border:1px solid var(--line);background:var(--surf-2);padding:var(--sp-3);text-align:left;box-shadow:var(--sh-1);
  transition:transform var(--t-1) var(--e-in)}
.pset:active{transform:scale(.97)}
.pset[aria-pressed="true"]{border-color:rgba(139,92,246,.5);background:var(--grad-dim)}
.pset .vis{height:42px;border-radius:var(--r-1);background:var(--surf-3);margin-bottom:8px;display:grid;place-items:center;overflow:hidden}
.pset b{font-size:var(--f-13);display:block;letter-spacing:-.01em}
.pset span{font-size:var(--f-11);color:var(--txt-3)}
.fname{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--f-12);color:var(--a3);word-break:break-all}
.inp{width:100%;background:var(--surf-3);border:1px solid var(--line);border-radius:var(--r-2);padding:11px var(--sp-3);font-size:var(--f-15);
  color:var(--txt-1)}
.inp::placeholder{color:var(--txt-3)}
.step{display:flex;align-items:center;gap:2px;background:var(--surf-3);border-radius:var(--r-2);padding:2px}
.step button{width:32px;height:30px;border-radius:var(--r-1);display:grid;place-items:center;color:var(--txt-2)}
.step b{min-width:34px;text-align:center;font-size:var(--f-13)}
/* ---- toasts / menu ---- */
#toasts{position:fixed;left:0;right:0;bottom:calc(var(--safe-b) + var(--sp-4));z-index:60;display:flex;flex-direction:column-reverse;
  gap:var(--sp-2);align-items:center;pointer-events:none;padding:0 var(--sp-4)}
.toast{pointer-events:auto;max-width:520px;width:100%;display:flex;align-items:center;gap:var(--sp-3);padding:12px var(--sp-4);
  border-radius:var(--r-3);background:var(--surf-glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);
  border:1px solid var(--line-strong);box-shadow:var(--sh-3);font-size:var(--f-13);
  animation:tin var(--t-3) var(--e-spring) both;will-change:transform}
@keyframes tin{from{opacity:0;transform:translate3d(0,20px,0) scale(.96)}to{opacity:1;transform:none}}
.toast.out{animation:tout var(--t-2) var(--e-in) forwards}
@keyframes tout{to{opacity:0;transform:translate3d(0,14px,0) scale(.97)}}
.toast .grow{flex:1;min-width:0}
.toast button{color:var(--a3);font-weight:650;font-size:var(--f-13);padding:4px 6px}
#ctx{position:fixed;z-index:70;min-width:212px;background:var(--surf-glass);backdrop-filter:blur(22px) saturate(1.7);
  -webkit-backdrop-filter:blur(22px) saturate(1.7);border:1px solid var(--line-strong);border-radius:var(--r-3);box-shadow:var(--sh-3);
  padding:5px;display:none;transform-origin:top left;animation:ctxin var(--t-2) var(--e-spring) both}
@keyframes ctxin{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
#ctx.on{display:block}
#ctx button{display:flex;width:100%;align-items:center;gap:var(--sp-3);padding:11px var(--sp-3);border-radius:var(--r-2);font-size:var(--f-15);text-align:left}
#ctx button:active{background:var(--surf-3)}
/* ---- inspector ---- */
.zoom{position:relative;flex:1;overflow:hidden;touch-action:none;background:var(--bg-2);display:grid;place-items:center}
.zoom .stage2{position:relative;transform-origin:0 0;will-change:transform}
.zoom img{display:block;max-width:none}
.zoom svg{position:absolute;inset:0;width:100%;height:100%}
.qpoly{fill:rgba(99,102,241,.16);stroke:var(--a2);stroke-width:2;vector-effect:non-scaling-stroke;transition:d var(--t-3) var(--e-in)}
.carou{display:flex;gap:var(--sp-3);overflow-x:auto;scroll-snap-type:x mandatory;padding:var(--sp-3) max(var(--sp-5),var(--safe-l));
  -webkit-overflow-scrolling:touch}
.lay{flex:none;width:96px;scroll-snap-align:center;border-radius:var(--r-2);border:1px solid var(--line);background:var(--surf-2);
  padding:6px;box-shadow:var(--sh-1);transition:transform var(--t-2) var(--e-in)}
.lay[aria-pressed="true"]{border-color:var(--a2);background:var(--grad-dim);transform:translateY(-3px)}
.lay svg{width:100%;height:96px;background:var(--surf-3);border-radius:4px}
.lay span{display:block;font-size:var(--f-11);color:var(--txt-3);margin-top:4px;text-align:center}
/* ---- misc ---- */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-3);padding:var(--sp-8);text-align:center;color:var(--txt-3);flex:1}
.bar-slim{height:3px;border-radius:var(--r-full);background:var(--surf-3);overflow:hidden}
.bar-slim i{display:block;height:100%;background:var(--grad-a);width:0;transition:width var(--t-2) linear;transform-origin:left}
.diag{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--f-11);color:var(--txt-2);white-space:pre-wrap;word-break:break-word;
  background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-2);padding:var(--sp-3);max-height:46dvh;overflow:auto}
#drop{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:rgba(8,9,12,.8);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);font-size:var(--f-20);font-weight:650;letter-spacing:-.02em}
#drop.on{display:grid}
#drop div{border:2px dashed var(--a2);border-radius:var(--r-6);padding:var(--sp-8) var(--sp-9);background:var(--grad-dim)}
#crash{position:fixed;inset:0;z-index:90;display:none;place-items:center;padding:var(--sp-5);background:var(--bg)}
#crash.on{display:grid}
@media (min-width:768px){
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
  .sheet{left:50%;right:auto;width:560px;transform:translate3d(-50%,100%,0)}
  .sheet.on{transform:translate3d(-50%,0,0)}
  .launch-top{max-width:660px}
}
@media (min-width:1200px){ .pgrid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));max-width:1280px;margin:0 auto} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
}
</style>

<body>
<div id="app">
  <!-- ===== LAUNCH ===== -->
  <section class="screen on enter" id="s-launch" aria-labelledby="lt">
    <div class="gridbg" aria-hidden="true"></div>
    <div class="mesh" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="launch-in pad">
      <div class="launch-top">
        <div class="brandmark" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6" fill="#fff" opacity=".95"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6" fill="#fff" opacity=".7"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6" fill="#fff" opacity=".7"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6" fill="#fff" opacity=".95"/></svg>
        </div>
        <h1 class="dsp" id="lt" style="font-size:var(--f-40)">PanelForge</h1>
        <p style="color:var(--txt-2);font-size:var(--f-17);letter-spacing:-.01em;max-width:30ch">
          Drop a comic issue. Get clean, export-ready panels. Entirely on device.</p>
        <div class="caps" id="caps" aria-label="Capabilities"></div>
      </div>
      <div class="thumbzone">
        <button class="btn pri wide" id="b-import">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 20h14"/></svg>
          Import pages
        </button>
        <button class="btn ghost wide" id="b-resume" hidden>Resume last session</button>
        <div style="display:flex;gap:var(--sp-3)">
          <button class="btn ghost" style="flex:1" id="b-projects">Projects</button>
          <button class="btn ghost" style="flex:1" id="b-settings">Settings</button>
        </div>
        <p style="font-size:var(--f-11);color:var(--txt-3);text-align:center">Images · PDF · CBZ · ACBF -- up to 40 pages</p>
      </div>
    </div>
  </section>

  <!-- ===== PROCESSING ===== -->
  <section class="screen" id="s-proc" aria-labelledby="pt">
    <div class="topbar pad">
      <div class="grow"><h2 id="pt">Extracting panels</h2></div>
      <button class="iconbtn" id="b-bg" aria-label="Run in background">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 9l-7 7-7-7"/></svg>
      </button>
    </div>
    <div class="pad" style="flex:none">
      <div class="ringwrap">
        <svg width="188" height="188" viewBox="0 0 188 188" aria-hidden="true">
          <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6366F1"/><stop offset=".55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#A855F7"/>
          </linearGradient></defs>
          <circle cx="94" cy="94" r="82" fill="none" stroke="var(--surf-3)" stroke-width="10"/>
          <circle cx="94" cy="94" r="82" fill="none" stroke="url(#rg)" stroke-width="10" stroke-linecap="round"
                  id="ring" stroke-dasharray="515.2" stroke-dashoffset="515.2" style="transition:stroke-dashoffset 320ms cubic-bezier(.16,1,.3,1)"/>
        </svg>
        <div class="ringtxt"><div><b class="mono" id="pct">0</b><span>percent</span></div></div>
      </div>
      <p class="stage" id="stage" aria-live="polite"><b>Preparing…</b></p>
      <div class="statrow" id="pstats"></div>
    </div>
    <div class="queue" id="queue" aria-label="Page queue"></div>
    <div class="pad thumbzone" style="flex:none">
      <button class="btn ghost wide" id="b-cancel">Cancel</button>
    </div>
  </section>

  <!-- ===== RESULTS ===== -->
  <section class="screen" id="s-res" aria-labelledby="rt">
    <div class="topbar pad">
      <button class="iconbtn" id="b-home" aria-label="Home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
      </button>
      <div class="grow"><h2 id="rt">Panels</h2><div style="font-size:var(--f-12);color:var(--txt-3)" id="rsub"></div></div>
      <button class="iconbtn" id="b-diag" aria-label="Diagnostics">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>
      </button>
    </div>
    <div class="pad" style="flex:none">
      <div class="seg" id="views" role="tablist" aria-label="View">
        <span class="pill" aria-hidden="true"></span>
        <button role="tab" aria-selected="true" data-v="panels">Panels</button>
        <button role="tab" aria-selected="false" data-v="pages">Pages</button>
        <button role="tab" aria-selected="false" data-v="film">Filmstrip</button>
      </div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="scroll" id="rbody" style="flex:1" role="tabpanel"></div>
    <div class="pad thumbzone" style="flex:none">
      <div style="display:flex;gap:var(--sp-3)">
        <button class="btn" style="flex:1" id="b-smart">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>
          Smart Select</button>
        <button class="btn pri" style="flex:1.35" id="b-export">Export<span id="xcount"></span></button>
      </div>
    </div>
  </section>

  <!-- ===== INSPECTOR ===== -->
  <section class="screen" id="s-insp" aria-labelledby="it">
    <div class="topbar pad">
      <button class="iconbtn" id="b-iback" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg>
      </button>
      <div class="grow"><h2 id="it">Page</h2><div style="font-size:var(--f-12);color:var(--txt-3)" id="isub"></div></div>
      <button class="iconbtn" id="b-adv" aria-label="Advanced" aria-pressed="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>
      </button>
    </div>
    <div class="zoom" id="zoom"><div class="stage2" id="stage2"></div></div>
    <div style="flex:none;padding-bottom:calc(var(--safe-b) + var(--sp-2))">
      <div class="hd pad" style="padding-top:var(--sp-2)">Alternative layouts -- swipe</div>
      <div class="carou" id="carou" aria-label="Alternative layouts"></div>
      <div class="pad" id="advdrawer" hidden style="padding-bottom:var(--sp-3)"></div>
    </div>
  </section>
</div>

<div id="toasts" aria-live="polite" aria-atomic="false"></div>
<div id="ctx" role="menu" aria-label="Panel actions"></div>
<div id="drop" aria-hidden="true"><div>Drop comic pages</div></div>
<div id="crash" role="alertdialog" aria-labelledby="crt">
  <div class="group" style="max-width:440px;padding:var(--sp-5)">
    <h2 class="ttl" id="crt" style="font-size:var(--f-20);margin-bottom:var(--sp-2)">Something broke</h2>
    <p style="color:var(--txt-2);font-size:var(--f-13);margin-bottom:var(--sp-4)" id="crmsg"></p>
    <div style="display:flex;gap:var(--sp-2)">
      <button class="btn sm" id="b-crcopy">Copy diagnostics</button>
      <button class="btn sm" id="b-crclose">Continue</button>
    </div>
  </div>
</div>
<input type="file" id="fin" multiple accept="image/*,.pdf,.cbz,.zip,.acbf,.xml,.cbr,.rar" style="position:fixed;left:-9999px;top:0" tabindex="-1" aria-hidden="true">
<input type="file" id="fmodel" accept=".onnx" style="position:fixed;left:-9999px;top:0" tabindex="-1" aria-hidden="true">

<script>
"use strict";
/* ============================================================================
 * PanelForge -- single-file offline comic panel extraction studio.
 *
 * MODULE ORDER
 *   Config → Utils → DetectionCore (pure, worker-safe) → Workers → Codecs(inflate/zip/exif/pdf)
 *   → Ingest → Store → Persistence → Pipeline → Neural → Cloud → Export → Components
 *   → Screens → Gestures → Diagnostics → Bootstrap
 *
 * NEURAL TIER CONSTANTS -- read this before filing a bug about the neural tier.
 * Both constants below are intentionally EMPTY. To enable the neural tier offline:
 *   1. EMBEDDED_ORT_WASM_B64: base64 of `ort-wasm-simd.wasm` from onnxruntime-web
 *      (plus you must also paste the ORT JS glue into ORT_JS_SOURCE below).
 *   2. EMBEDDED_PANEL_MODEL_B64: base64 of a YOLOv8-class comic-panel .onnx
 *      (Manga109 / DCM772 / eBDtheque trained), single class = panel, 640x640 input.
 * Nothing is fabricated here. While empty the tier disables itself silently and the
 * classical ensemble runs at full capability. Settings → Install model also accepts a
 * local .onnx which is persisted in IndexedDB (that path needs ORT present too).
 * ========================================================================== */
const EMBEDDED_ORT_WASM_B64 = "";
const EMBEDDED_PANEL_MODEL_B64 = "";
const ORT_JS_SOURCE = ""; /* paste ort.min.js source here to enable the tier */

/* ============================================================================
 * CONFIG -- all tunables. Internal only; never surfaced as sliders.
 * ========================================================================== */
const CONFIG = {
  WORK_EDGE: 1400,          // longest edge of the detection image, px. 900–1800. Detection cost ~O(n^2).
  WORK_EDGE_SLOW: 1000,     // adaptive-quality fallback for slow devices.
  THUMB_EDGE: 320,          // cached UI thumbnail longest edge. Keep small: 40 pages held at once.
  MAX_PAGES: 40,            // hard ingest cap; protects mobile memory.
  MIN_IMG: 400,             // reject smaller than this (px, longest edge).
  MAX_IMG: 12000,           // reject larger; likely a scanner artefact.
  IOS_CANVAS_MAX_AREA: 16.7e6, // Safari canvas backing-store ceiling; tile crops above this.

  SPREAD_ASPECT: 1.3,       // w/h above this => double-page spread, split at centrefold.
  WEBTOON_ASPECT: 1 / 3,    // w/h below this => vertical strip, vertical-only segmentation.

  // ---- preprocess ----
  ILLUM_RADIUS_FRAC: 0.085, // background-estimation box radius as fraction of longest edge. 0.05–0.15.
  DESKEW_MAX_DEG: 8,        // deskew search half-range. Beyond this it's perspective, not skew.
  DESKEW_STEP_DEG: 0.25,
  SAUVOLA_K: 0.28,          // Sauvola sensitivity. Lower => more ink kept.
  SAUVOLA_WIN_FRAC: 0.06,
  ADAPT_WIN_FRAC: 0.045,
  ADAPT_BIAS: 7,            // adaptive-mean offset in grey levels.
  PERSP_TOL: 0.022,         // quad-vs-rect deviation (fraction of edge) that triggers homography rectify.

  // ---- geometry sanity ----
  MIN_PANEL_AREA_FRAC: 0.011,  // panels smaller than 1.1% of page area are noise/logos.
  MAX_PANEL_AREA_FRAC: 0.985,
  MIN_PANEL_EDGE_FRAC: 0.055,  // reject slivers.
  MAX_ASPECT: 7.5,             // w/h or h/w beyond this is a rule line, not a panel.

  // ---- engine params (auto-tuned; these are seeds) ----
  P: {
    gutterFrac: 0.15,       // max content fraction in a row/col still considered gutter. 0.04–0.30.
    partialCut: 0.86,       // fraction of a cut line that must be clear (allows balloon overhang).
    minGutterPx: 3,
    binVariant: 1,          // 0 otsu | 1 adaptive | 2 sauvola
    edgeThresh: 0.20,       // hysteresis high threshold as fraction of max Sobel magnitude.
    mergeGapFrac: 0.022,    // CC merge gap as fraction of longest edge.
    lineLenFrac: 0.22,      // min segment length for the line engine.
    lineGapFrac: 0.26,      // max occlusion gap bridged when completing lines. THE balloon fix.
    seamSens: 1.25,         // seam-peak prominence multiplier.
    morphLenFrac: 0.17      // structuring-element length for border reconstruction.
  },

  // ---- plausibility scorer weights (sum normalised internally) ----
  W: {
    align: 0.215,    // edge coordinates collapsing onto a shared grid -- strongest single signal.
    coverage: 0.135, // fraction of content area claimed by panels.
    gutter: 0.085,   // gutter-width consistency.
    overlap: 0.115,  // illegal overlap penalty (legitimate containment exempt).
    border: 0.135,   // perimeter border support under panel outlines.
    interior: 0.105, // penalty for cuts slicing through dense artwork (a face, usually).
    content: 0.075,  // no near-blank panels.
    count: 0.055,    // soft prior peaking at 3–9 panels.
    aspect: 0.030,
    rect: 0.030,     // rectangularity or a consistent global skew.
    tiling: 0.020,   // regularity of the implied tiling.
    grid: 0.000      // filled in during the consensus pass (issue-grid agreement).
  },
  GRID_W: 0.16,       // weight injected into W.grid during consensus.
  COUNT_PRIOR: [0.30,0.52,0.80,0.95,1.00,1.00,1.00,0.98,0.92,0.80,0.66,0.52,0.40,0.30],

  // ---- autotune ----
  TUNE_SAMPLES: 22,       // low-discrepancy (Halton) samples. 12–32.
  TUNE_SAMPLES_SLOW: 10,
  TUNE_TOPK: 3,           // seeds refined by coordinate descent.
  TUNE_REFINE: 2,         // descent passes.
  TUNE_EARLY: 0.93,       // score that ends the search -- clean pages cost almost nothing.
  WARM_START_BONUS: true, // always evaluate previous page's winner first.

  // ---- fusion / confidence ----
  FUSE_IOU: 0.55,         // cluster panels across engines above this IoU.
  AGREE_IOU: 0.70,        // cross-engine agreement threshold used for per-panel confidence.
  CONF_KEEP: 0.62,        // panels below this are silently discarded (precision over recall).
  CONF_SELECT: 0.74,      // panels below this land deselected on the results screen.
  ALT_LAYOUTS: 5,
  ENGINE_EMA: 0.22,       // per-engine reliability EMA rate across the project.

  // ---- escalation ----
  NEURAL_BELOW: 0.82,
  CLOUD_BELOW: 0.75,
  CONSENSUS_BELOW: 0.86,  // pages re-run with the learned issue grid.
  GRID_SNAP_FRAC: 0.028,  // snap tolerance to a learned grid line (fraction of page edge).

  // ---- export ----
  PAD: { tight: 0.006, balanced: 0.015, generous: 0.028 },
  KEN_OVERSIZE: 1.4,      // Ken Burns headroom beyond 1080x1920.
  OUT_W: 1080, OUT_H: 1920,
  MAX_UPSCALE: 2.0,
  JPEG_Q: 0.92,
  SMART_TARGET: 20,
  CLOUD_TIMEOUT: 15000,
  CLOUD_DAILY: 40
};

/* ============================================================================
 * UTILS
 * ========================================================================== */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const nowMs = () => (performance && performance.now ? performance.now() : Date.now());
const raf = (fn) => requestAnimationFrame(fn);
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const nextFrame = () => new Promise(r => raf(() => r()));
const fmtBytes = (n) => n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(0) + " KB" : (n / 1048576).toFixed(1) + " MB";
const pad2 = (n, w) => String(n).padStart(w || 2, "0");
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const Logger = (() => {
  const buf = []; const MAX = 900;
  function put(level, tag, msg, data) {
    const e = { t: Math.round(nowMs()), level, tag, msg, data };
    buf.push(e); if (buf.length > MAX) buf.shift();
    return e;
  }
  return {

      const a = h[i], b = h[(i + 1) % h.length];
      const ex = b[0] - a[0], ey = b[1] - a[1], L = Math.hypot(ex, ey) || 1;
      const ux = ex / L, uy = ey / L;
      let u0 = 1e18, u1 = -1e18, v0 = 1e18, v1 = -1e18;
      for (const p of h) {
        const u = p[0] * ux + p[1] * uy, v = -p[0] * uy + p[1] * ux;
        if (u < u0) u0 = u; if (u > u1) u1 = u; if (v < v0) v0 = v; if (v > v1) v1 = v;
      }
      const area = (u1 - u0) * (v1 - v0);
      if (!best || area < best.area) best = { area, ux, uy, u0, u1, v0, v1 };
    }
    const { ux, uy, u0, u1, v0, v1 } = best;
    const un = (u, v) => [u * ux - v * uy, u * uy + v * ux];
    return [un(u0, v0), un(u1, v0), un(u1, v1), un(u0, v1)];
  }

  /* ---------- exact EDT (Felzenszwalb & Huttenlocher, separable, O(N)) ---------- */
  function edt(bin, W, H) { // distance from bin==0 (background)
    const INF = 1e12, f = new Float64Array(Math.max(W, H)), d = new Float64Array(W * H);
    const v = new Int32Array(Math.max(W, H) + 1), z = new Float64Array(Math.max(W, H) + 2);
    function pass1d(arr, n, get, set) {
      for (let i = 0; i < n; i++) f[i] = get(i);
      let k = 0; v[0] = 0; z[0] = -INF; z[1] = INF;
      for (let q = 1; q < n; q++) {
        let s;
        for (; ;) {
          s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
          if (s <= z[k]) k--; else break;
        }
        k++; v[k] = q; z[k] = s; z[k + 1] = INF;
      }
      k = 0;
      for (let q = 0; q < n; q++) {
        while (z[k + 1] < q) k++;
        set(q, (q - v[k]) * (q - v[k]) + f[v[k]]);
      }
    }
    for (let x = 0; x < W; x++)
      pass1d(null, H, (y) => bin[y * W + x] ? INF : 0, (y, val) => { d[y * W + x] = val; });
    for (let y = 0; y < H; y++)
      pass1d(null, W, (x) => d[y * W + x], (x, val) => { d[y * W + x] = Math.sqrt(val); });
    return d;
  }

  /* ---------- min-heap for watershed ---------- */
  function Heap() {
    const a = [];
    return {
      size: () => a.length,
      push(p, i) { a.push([p, i]); let c = a.length - 1; while (c > 0) { const pa = (c - 1) >> 1; if (a[pa][0] <= a[c][0]) break; const t = a[pa]; a[pa] = a[c]; a[c] = t; c = pa; } },
      pop() {
        const top = a[0], last = a.pop();
        if (a.length) { a[0] = last; let i = 0; for (; ;) { const l = 2 * i + 1, r = l + 1; let s = i; if (l < a.length && a[l][0] < a[s][0]) s = l; if (r < a.length && a[r][0] < a[s][0]) s = r; if (s === i) break; const t = a[s]; a[s] = a[i]; a[i] = t; i = s; } }
        return top;
      }
    };
  }

  /* ==========================================================================
   * BALLOON SUPPRESSION -- the single highest-impact pre-pass. A speech balloon or
   * SFX glyph crossing a panel border bridges two panels into one blob and defeats
   * projection, flood-fill and contour engines alike. We find closed light convex
   * blobs with sparse dark text inside (balloons), rectangular light boxes
   * (captions) and large irregular ink clusters (SFX), then erase them from the
   * DETECTION MASK ONLY. Export pixels are never touched.
   * ========================================================================== */
  function balloonMask(gray, bin, W, H, darkInk) {
    const area = W * H;
    // "paper" = light regions in a dark-ink page: invert ink and label
    const paper = new Uint8Array(area);
    for (let i = 0; i < area; i++) paper[i] = bin[i] ? 0 : 1;
    // close small text gaps so balloon interiors become solid blobs
    const closed = erode(dilate(paper, W, H, 2), W, H, 2);
    const { lab, comps } = labelCC(closed, W, H, 1);
    const out = new Uint8Array(area);
    const inkI = integral(bin, W, H);
    for (const c of comps) {
      const w = c.x1 - c.x0 + 1, h = c.y1 - c.y0 + 1, a = w * h;
      if (a < area * 0.0018 || a > area * 0.14) continue;      // too small = letter, too big = panel
      const fill = c.n / a;
      if (fill < 0.55) continue;                                // balloons are convex-ish and well filled
      const ar = w / h; if (ar > 4.5 || ar < 0.22) continue;
      const inkIn = boxSum(inkI, W, c.x0, c.y0, c.x1, c.y1) / a;
      if (inkIn > 0.42) continue;                               // dense ink inside => artwork, not a balloon
      // sparse dark text requirement: some ink, but little
      if (inkIn < 0.012) continue;
      for (let y = c.y0; y <= c.y1; y++) for (let x = c.x0; x <= c.x1; x++)
        if (lab[y * W + x] === c.id) out[y * W + x] = 1;
    }
    // SFX / large irregular ink clusters straddling borders: big ink comps that are
    // NOT long thin lines (those are borders) and not page-sized.
    const ink = labelCC(bin, W, H, 1);
    for (const c of ink.comps) {
      const w = c.x1 - c.x0 + 1, h = c.y1 - c.y0 + 1, a = w * h;
      if (a < area * 0.004 || a > area * 0.09) continue;
      const fill = c.n / a;
      if (fill < 0.16 || fill > 0.75) continue;                 // lines have tiny fill; solids are art
      if (w > W * 0.6 || h > H * 0.6) continue;                 // that's a border, keep it
      for (let y = c.y0; y <= c.y1; y++) for (let x = c.x0; x <= c.x1; x++)
        if (ink.lab[y * W + x] === c.id) out[y * W + x] = 1;
    }
    return dilate(out, W, H, 1);
  }

  /* ==========================================================================
   * ENGINE 1 -- recursive gutter projection cut.
   * Row/column background profiles; best-cut selection; recursion. Partial cuts
   * (>= partialCut of the span clear) are allowed so a balloon overhanging a gutter
   * does not defeat it. Near-perfect on regular grids, which is most mainstream work.
   * ========================================================================== */
  function engProjection(ctx, P) {
    const { mask, W, H } = ctx;
    const out = [];
    const minW = W * CONFIG_MIN_EDGE, minH = H * CONFIG_MIN_EDGE;
    const minGut = Math.max(P.minGutterPx, Math.round(Math.max(W, H) * 0.006));
    const stack = [{ x: 0, y: 0, w: W, h: H, d: 0 }];
    while (stack.length) {
      const r = stack.pop();
      if (r.d > 7) { out.push(r); continue; }
      const cut = bestCut(mask, W, H, r, P, minGut, minW, minH);
      if (!cut) { out.push(r); continue; }
      if (cut.axis === "v") {
        stack.push({ x: r.x, y: r.y, w: cut.a - r.x, h: r.h, d: r.d + 1 });
        stack.push({ x: cut.b, y: r.y, w: r.x + r.w - cut.b, h: r.h, d: r.d + 1 });
      } else {
        stack.push({ x: r.x, y: r.y, w: r.w, h: cut.a - r.y, d: r.d + 1 });
        stack.push({ x: r.x, y: cut.b, w: r.w, h: r.y + r.h - cut.b, d: r.d + 1 });
      }
    }
    return out.filter(r => r.w >= minW && r.h >= minH).map(r => ({ x: r.x, y: r.y, w: r.w, h: r.h }));
  }
  const CONFIG_MIN_EDGE = 0.055;
  function bestCut(mask, W, H, r, P, minGut, minW, minH) {
    const cands = [];
    // vertical gutters: columns whose content fraction is below gutterFrac
    const colOK = new Uint8Array(r.w);
    for (let x = 0; x < r.w; x++) {
      let n = 0;
      for (let y = r.y; y < r.y + r.h; y++) if (mask[y * W + r.x + x]) n++;
      colOK[x] = (n / r.h) <= P.gutterFrac ? 1 : 0;
    }
    collectRuns(colOK, r.w, minGut, (s, e) => {
      const a = r.x + s, b = r.x + e + 1;
      if (a - r.x < minW || r.x + r.w - b < minW) return;
      cands.push({ axis: "v", a, b, len: e - s + 1, mid: Math.abs((a + b) / 2 - (r.x + r.w / 2)) / r.w });
    });
    const rowOK = new Uint8Array(r.h);
    for (let y = 0; y < r.h; y++) {
      let n = 0;
      for (let x = r.x; x < r.x + r.w; x++) if (mask[(r.y + y) * W + x]) n++;
      rowOK[y] = (n / r.w) <= P.gutterFrac ? 1 : 0;
    }
    collectRuns(rowOK, r.h, minGut, (s, e) => {
      const a = r.y + s, b = r.y + e + 1;
      if (a - r.y < minH || r.y + r.h - b < minH) return;
      cands.push({ axis: "h", a, b, len: e - s + 1, mid: Math.abs((a + b) / 2 - (r.y + r.h / 2)) / r.h });
    });
    if (!cands.length) return null;
    // prefer wide gutters near the middle; horizontal cuts slightly preferred (comics read in rows)
    let best = null, bs = -1;
    for (const c of cands) {
      const s = Math.min(1, c.len / (minGut * 4)) * 1.0 + (1 - c.mid) * 0.55 + (c.axis === "h" ? 0.08 : 0);
      if (s > bs) { bs = s; best = c; }
    }
    return best;
  }
  function collectRuns(ok, n, minLen, cb) {
    let s = -1;
    for (let i = 0; i <= n; i++) {
      const v = i < n ? ok[i] : 0;
      if (v && s < 0) s = i;
      else if (!v && s >= 0) { if (i - s >= minLen) cb(s, i - 1); s = -1; }
    }
  }

  /* ==========================================================================
   * ENGINE 2 -- background flood-fill connected components + gap merge.
   * Recovers borderless floating-art panels that no line engine can see. Union-find
   * labelling (iterative), area/aspect filter, then a merge pass joining components
   * whose gap is below the page's typical gutter width. Rotated rect via calipers.
   * ========================================================================== */
  function engFlood(ctx, P) {
    const { mask, W, H } = ctx;
    const sc = 2; // work at half res: 4x faster, no accuracy loss at panel scale
    const w2 = Math.max(8, W >> 1), h2 = Math.max(8, H >> 1);
    const m2 = new Uint8Array(w2 * h2);
    for (let y = 0; y < h2; y++) for (let x = 0; x < w2; x++) {
      const i = (y * sc) * W + x * sc;
      m2[y * w2 + x] = (mask[i] || mask[i + 1] || mask[i + W] || mask[i + W + 1]) ? 1 : 0;
    }
    const closed = dilate(m2, w2, h2, 2);
    const { lab, comps } = labelCC(closed, w2, h2, 1);
    const area2 = w2 * h2;
    let boxes = comps.filter(c => c.n > area2 * 0.006).map(c => ({
      x: c.x0 * sc, y: c.y0 * sc, w: (c.x1 - c.x0 + 1) * sc, h: (c.y1 - c.y0 + 1) * sc, id: c.id, n: c.n
    }));
    // merge pass: join boxes separated by less than the typical gutter
    const gap = Math.max(3, Math.round(Math.max(W, H) * P.mergeGapFrac));
    let merged = true, guard = 0;
    while (merged && guard++ < 60) {
      merged = false;
      for (let i = 0; i < boxes.length && !merged; i++) for (let j = i + 1; j < boxes.length; j++) {
        const a = boxes[i], b = boxes[j];
        const dx = Math.max(0, Math.max(a.x - (b.x + b.w), b.x - (a.x + a.w)));
        const dy = Math.max(0, Math.max(a.y - (b.y + b.h), b.y - (a.y + a.h)));
        const ovX = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
        const ovY = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
        // only merge when they are aligned along the shared axis (avoid diagonal chaining)
        const aligned = (dx <= gap && ovY > Math.min(a.h, b.h) * 0.5) || (dy <= gap && ovX > Math.min(a.w, b.w) * 0.5);
        if (!aligned) continue;
        const nx = Math.min(a.x, b.x), ny = Math.min(a.y, b.y);
        boxes[i] = { x: nx, y: ny, w: Math.max(a.x + a.w, b.x + b.w) - nx, h: Math.max(a.y + a.h, b.y + b.h) - ny, n: a.n + b.n, ids: [] };
        boxes.splice(j, 1); merged = true; break;
      }
    }
    // rotated fit via calipers on the component points (only when clearly tilted)
    const res = [];
    for (const b of boxes) {
      const pts = [];
      for (let y = b.y; y < b.y + b.h; y += 3) for (let x = b.x; x < b.x + b.w; x += 3)
        if (mask[y * W + x]) pts.push([x, y]);
      let quad = null;
      if (pts.length > 40) {
        const mr = minAreaRect(pts);
        if (mr) {
          const ar = rectOf(mr), fill = polyArea(mr) / Math.max(1, ar.w * ar.h);
          if (fill < 0.94) quad = mr; // meaningfully rotated
        }
      }
      res.push(quad ? { quad, ...rectOf(quad) } : { x: b.x, y: b.y, w: b.w, h: b.h });
    }
    return res;
  }
  function polyArea(p) {
    let a = 0; for (let i = 0; i < p.length; i++) { const q = p[(i + 1) % p.length]; a += p[i][0] * q[1] - q[0] * p[i][1]; }
    return Math.abs(a) / 2;
  }

  /* ==========================================================================
   * ENGINE 3 -- line-segment graph + rectangle hypothesis scoring.
   * The most powerful classical engine here. Extract long H/V segments, merge
   * collinear, then COMPLETE LINES THROUGH OCCLUSIONS by joining segments sharing a
   * perpendicular offset across a gap -- this is the real fix for balloon-bridged
   * borders. Enumerate candidate quads from the line lattice and score by perimeter
   * support + interior density + corner support. Selection permits full containment,
   * which is how an inset panel sits inside a splash page.
   * ========================================================================== */
  function engLines(ctx, P) {
    const { edge, mask, W, H } = ctx;
    const minLenH = Math.max(24, W * P.lineLenFrac), minLenV = Math.max(24, H * P.lineLenFrac);
    const gapH = W * P.lineGapFrac, gapV = H * P.lineGapFrac;
    // ---- horizontal segments: scan rows, tolerate ±1 row wobble
    const hsegs = [];
    for (let y = 0; y < H; y++) {
      let s = -1;
      for (let x = 0; x <= W; x++) {
        let on = false;
        if (x < W) on = !!(edge[y * W + x] || (y > 0 && edge[(y - 1) * W + x]) || (y < H - 1 && edge[(y + 1) * W + x]));
        if (on && s < 0) s = x;
        else if (!on && s >= 0) { if (x - s >= minLenH * 0.4) hsegs.push({ p: y, a: s, b: x - 1 }); s = -1; }
      }
    }
    const vsegs = [];
    for (let x = 0; x < W; x++) {
      let s = -1;
      for (let y = 0; y <= H; y++) {
        let on = false;
        if (y < H) on = !!(edge[y * W + x] || (x > 0 && edge[y * W + x - 1]) || (x < W - 1 && edge[y * W + x + 1]));
        if (on && s < 0) s = y;
        else if (!on && s >= 0) { if (y - s >= minLenV * 0.4) vsegs.push({ p: x, a: s, b: y - 1 }); s = -1; }
      }
    }
    const hlines = completeLines(hsegs, gapH, minLenH, 3);
    const vlines = completeLines(vsegs, gapV, minLenV, 3);
    // page borders are always valid hypotheses
    const xs = clusterCoords(vlines.map(l => l.p).concat([0, W - 1]), Math.max(4, W * 0.012), 14);
    const ys = clusterCoords(hlines.map(l => l.p).concat([0, H - 1]), Math.max(4, H * 0.012), 16);
    // ---- enumerate quads
    const inkI = integral(mask, W, H), edgeI = integral(edge, W, H);
    const cands = [];
    const minW = W * CONFIG_MIN_EDGE, minH = H * CONFIG_MIN_EDGE;
    for (let i = 0; i < xs.length - 1; i++) for (let j = i + 1; j < xs.length; j++) {
      const x0 = xs[i], x1 = xs[j]; if (x1 - x0 < minW) continue;
      for (let k = 0; k < ys.length - 1; k++) for (let l = k + 1; l < ys.length; l++) {
        const y0 = ys[k], y1 = ys[l]; if (y1 - y0 < minH) continue;
        const r = { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
        if (r.w * r.h > W * H * 0.99) continue;
        const sup = perimeterSupport(edgeI, W, H, r);
        const dens = boxSum(inkI, W, r.x | 0, r.y | 0, Math.min(W - 1, (r.x + r.w) | 0), Math.min(H - 1, (r.y + r.h) | 0)) / (r.w * r.h);
        const corner = cornerSupport(edge, W, H, r);
        // support dominates: a rectangle whose outline sits on real ink is a real panel
        const sc = sup * 0.56 + corner * 0.22 + Math.min(1, dens / 0.14) * 0.22;
        if (sc > 0.44) cands.push({ ...r, sc, sup });
      }
    }
    cands.sort((a, b) => b.sc - a.sc);
    // greedy non-conflicting selection; containment allowed (inset in splash)
    const sel = [];
    for (const c of cands) {
      let ok = true;
      for (const s of sel) {
        if (contains(s, c, 3) || contains(c, s, 3)) continue;  // legitimate nesting
        const ia = interArea(s, c);
        if (ia > 0.14 * Math.min(s.w * s.h, c.w * c.h)) { ok = false; break; }
      }
      if (ok) sel.push(c);
      if (sel.length > 24) break;
    }
    return sel.map(r => ({ x: r.x, y: r.y, w: r.w, h: r.h, support: r.sup }));
  }
  /* Merge collinear segments and bridge occlusion gaps. Two segments with the same
     perpendicular offset (±tol) whose ends are within `gap` become one line -- a
     balloon covering 90px of a border no longer splits it. */
  function completeLines(segs, gap, minLen, tol) {
    const byP = new Map();
    for (const s of segs) {
      const key = Math.round(s.p / tol);
      if (!byP.has(key)) byP.set(key, []);
      byP.get(key).push(s);
    }
    const out = [];
    for (const arr of byP.values()) {
      arr.sort((a, b) => a.a - b.a);
      let cur = null;
      for (const s of arr) {
        if (!cur) { cur = { p: s.p, a: s.a, b: s.b, cov: s.b - s.a }; continue; }
        if (s.a - cur.b <= gap) { cur.b = Math.max(cur.b, s.b); cur.cov += Math.max(0, s.b - s.a); cur.p = (cur.p + s.p) / 2; }
        else { if (cur.b - cur.a >= minLen && cur.cov > (cur.b - cur.a) * 0.55) out.push(cur); cur = { p: s.p, a: s.a, b: s.b, cov: s.b - s.a }; }
      }
      if (cur && cur.b - cur.a >= minLen && cur.cov > (cur.b - cur.a) * 0.55) out.push(cur);
    }
    return out;
  }
  function clusterCoords(vals, tol, maxN) {
    const v = vals.slice().sort((a, b) => a - b);
    const groups = [];
    for (const x of v) {
      const g = groups[groups.length - 1];
      if (g && x - g.last <= tol) { g.sum += x; g.n++; g.last = x; }
      else groups.push({ sum: x, n: 1, last: x });
    }
    let out = groups.map(g => ({ c: g.sum / g.n, n: g.n }));
    out.sort((a, b) => b.n - a.n);
    out = out.slice(0, maxN).map(o => Math.round(o.c));
    out.sort((a, b) => a - b);
    return out;
  }
  function perimeterSupport(edgeI, W, H, r) {
    const t = 2, cl = (v, m) => Math.max(0, Math.min(m - 1, Math.round(v)));
    function strip(x0, y0, x1, y1) {
      x0 = cl(x0, W); x1 = cl(x1, W); y0 = cl(y0, H); y1 = cl(y1, H);
      if (x1 < x0 || y1 < y0) return 0;
      const n = (x1 - x0 + 1) * (y1 - y0 + 1);
      return boxSum(edgeI, W, x0, y0, x1, y1) / n;
    }
    const top = strip(r.x, r.y - t, r.x + r.w, r.y + t);
    const bot = strip(r.x, r.y + r.h - t, r.x + r.w, r.y + r.h + t);
    const lef = strip(r.x - t, r.y, r.x + t, r.y + r.h);
    const rig = strip(r.x + r.w - t, r.y, r.x + r.w + t, r.y + r.h);

    return (f(top) + f(bot) + f(lef) + f(rig)) / 4;
  }
  function cornerSupport(edge, W, H, r) {
    const k = Math.max(4, Math.round(Math.min(r.w, r.h) * 0.06));
    const cs = [[r.x, r.y], [r.x + r.w, r.y], [r.x, r.y + r.h], [r.x + r.w, r.y + r.h]];
    let hit = 0;
    for (const [cx, cy] of cs) {
      let f = false;
      for (let dy = -k; dy <= k && !f; dy++) for (let dx = -k; dx <= k; dx++) {
        const x = Math.round(cx + dx), y = Math.round(cy + dy);
        if (x < 0 || y < 0 || x >= W || y >= H) continue;
        if (edge[y * W + x]) { f = true; break; }
      }
      if (f) hit++;
    }
    return hit / 4;
  }

  /* ==========================================================================
   * ENGINE 4 -- colour/texture discontinuity seam finder (the full-bleed solver).
   * Where panels butt with no gutter, per-column/row histogram distance still spikes
   * at the seam. Fused with gradient-orientation coherence change and edge-energy
   * projection, then NMS on the peaks. Weighted heavily when other engines return a
   * single page-filling panel, but the scorer makes the final call.
   * ========================================================================== */
  function engSeam(ctx, P) {
    const { gray, edge, ori, W, H } = ctx;
    const vx = seamPeaks(gray, edge, ori, W, H, true, P);
    const hy = seamPeaks(gray, edge, ori, W, H, false, P);
    const xs = [0].concat(vx, [W]);
    const ys = [0].concat(hy, [H]);
    const out = [];
    for (let i = 0; i < xs.length - 1; i++) for (let j = 0; j < ys.length - 1; j++) {
      const r = { x: xs[i], y: ys[j], w: xs[i + 1] - xs[i], h: ys[j + 1] - ys[j] };
      if (r.w >= W * CONFIG_MIN_EDGE && r.h >= H * CONFIG_MIN_EDGE) out.push(r);
    }

      const engs = new Set();
      for (const it of cl) { const ww = Math.max(0.05, it.w); sw += ww; x += it.x * ww; y += it.y * ww; w += it.w * ww; h += it.h * ww; engs.add(it.eng); }
      const agree = cl.filter(it => iou(it, { x: x / sw, y: y / sw, w: w / sw, h: h / sw }) >= CONFIG.AGREE_IOU);
      const agreeEng = new Set(agree.map(a => a.eng)).size;
      const quadItem = cl.find(it => it.quad || it.poly);
      const p = { x: x / sw, y: y / sw, w: w / sw, h: h / sw, engines: Array.from(engs) };
      if (quadItem && agreeEng >= 1) { p.quad = quadItem.quad; p.poly = quadItem.poly; }
      // confidence: agreement (dominant) + weight mass + perimeter support
      const sup = perimeterSupport(ctx.edgeI, ctx.W, ctx.H, p);
      p.conf = Math.min(1,
        0.56 * Math.min(1, agreeEng / Math.min(4, nEng)) +
        0.20 * Math.min(1, sw / 2.2) +
        0.24 * sup);
      out.push(p);
    }
    // resolve illegal overlaps by dropping the lower-confidence panel (precision first)
    out.sort((a, b) => b.conf - a.conf);
    const keep = [];
    for (const p of out) {
      let ok = true;
      for (const q of keep) {
        if (contains(q, p, 4) || contains(p, q, 4)) continue;
        if (interArea(p, q) > 0.2 * Math.min(p.w * p.h, q.w * q.h)) { ok = false; break; }
      }
      if (ok) keep.push(p);
    }
    return keep;
  }

  /* Halton low-discrepancy sequence -- far better coverage than random for ~20 samples. */
  function halton(i, b) { let f = 1, r = 0; while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); } return r; }
  const TUNE_DIMS = [
    ["gutterFrac", 0.04, 0.30], ["partialCut", 0.72, 0.96], ["edgeThresh", 0.10, 0.34],
    ["mergeGapFrac", 0.008, 0.042], ["lineLenFrac", 0.14, 0.34], ["lineGapFrac", 0.10, 0.38],
    ["seamSens", 0.85, 2.1], ["morphLenFrac", 0.10, 0.26]
  ];
  function paramsFromVector(v, base) {
    const P = Object.assign({}, base);
    TUNE_DIMS.forEach(([k, lo, hi], i) => { P[k] = lo + (hi - lo) * v[i]; });
    P.binVariant = v[TUNE_DIMS.length] < 0.34 ? 0 : v[TUNE_DIMS.length] < 0.67 ? 1 : 2;
    return P;
  }
  function vectorFromParams(P) {
    const v = TUNE_DIMS.map(([k, lo, hi]) => clamp01((P[k] - lo) / (hi - lo)));
    v.push(P.binVariant === 0 ? 0.15 : P.binVariant === 1 ? 0.5 : 0.85);
    return v;
  }
  const clamp01 = (v) => v < 0 ? 0 : v > 1 ? 1 : v;

  /* ---------- context build (per binarisation variant / polarity) ---------- */
  function buildCtx(pre, P) {
    const bin = P.binVariant === 0 ? pre.binO : P.binVariant === 1 ? pre.binA : pre.binS;
    const edge = hysteresis(pre.mag, pre.W, pre.H, pre.magMax, P.edgeThresh);
    // detection mask = ink minus balloons; erased from DETECTION only
    const mask = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) mask[i] = (bin[i] && !pre.balloons[i]) ? 1 : 0;
    const edge2 = new Uint8Array(edge.length);
    for (let i = 0; i < edge.length; i++) edge2[i] = (edge[i] && !pre.balloons[i]) ? 1 : 0;
    return {
      W: pre.W, H: pre.H, gray: pre.gray, ori: pre.ori, bin, mask, edge: edge2,
      maskI: integral(mask, pre.W, pre.H), edgeI: integral(edge2, pre.W, pre.H)
    };
  }

  /* ---------- preprocess to the point of engine-ready buffers ---------- */
  function preprocess(rgba, W0, H0, opts) {
    const t0 = Date.now();
    let gray = toGray(rgba, W0, H0);
    gray = normalizeIllum(gray, W0, H0, CONFIG.ILLUM_RADIUS_FRAC);
    gray = denoise3(gray, W0, H0);
    // rectify: page quad -> homography; else deskew rotation. F maps working->rect.
    let W = W0, H = H0, F = new Float64Array([1, 0, 0, 0, 1, 0, 0, 0, 1]);
    let rectified = gray, note = null;
    const s0 = sobel(gray, W0, H0);
    const e0 = hysteresis(s0.mag, W0, H0, s0.max, 0.22);
    const pq = opts.noRectify ? null : pageQuad(gray, W0, H0);
    if (pq) {
      const dev = quadRectDeviation(pq);
      if (dev > CONFIG.PERSP_TOL) {
        const r = rectOf(pq);
        const OW = Math.max(64, Math.round(r.w)), OH = Math.max(64, Math.round(r.h));
        const dst = [[0, 0], [OW, 0], [OW, OH], [0, OH]];
        F = homography(pq, dst);
        rectified = warpGray(gray, W0, H0, mat3inv(F), OW, OH);
        W = OW; H = OH; note = "perspective corrected";
      }
    }
    if (!note && !opts.noDeskew) {
      const ang = deskewAngle(e0, W0, H0, CONFIG.DESKEW_MAX_DEG, CONFIG.DESKEW_STEP_DEG);
      if (Math.abs(ang) > 0.35 * Math.PI / 180) {
        const c = Math.cos(-ang), s = Math.sin(-ang);
        const cx = W0 / 2, cy = H0 / 2;
        F = new Float64Array([c, -s, cx - c * cx + s * cy, s, c, cy - s * cx - c * cy, 0, 0, 1]);
        rectified = warpGray(gray, W0, H0, mat3inv(F), W0, H0);
        note = "deskewed " + (ang * 180 / Math.PI).toFixed(2) + "°";
      }
    }
    // polarity: run both light-gutter and dark-gutter assumptions; caller keeps the winner
    const s = sobel(rectified, W, H);
    const pre = { W, H, gray: rectified, mag: s.mag, ori: s.ori, magMax: s.max, F, note, ms: Date.now() - t0 };
    return pre;
  }
  function quadRectDeviation(q) {
    const r = rectOf(q); const ideal = quadOf(r);
    let d = 0; for (let i = 0; i < 4; i++) d += Math.hypot(q[i][0] - ideal[i][0], q[i][1] - ideal[i][1]);
    return d / 4 / Math.max(1, Math.max(r.w, r.h));
  }
  function makePolarity(pre, darkInk) {
    const binO = binOtsu(pre.gray, pre.W, pre.H, darkInk);
    const binA = binAdaptive(pre.gray, pre.W, pre.H, CONFIG.ADAPT_WIN_FRAC, CONFIG.ADAPT_BIAS, darkInk);
    const binS = binSauvola(pre.gray, pre.W, pre.H, CONFIG.SAUVOLA_WIN_FRAC, CONFIG.SAUVOLA_K, darkInk);
    const clean = suppressHalftone(binA, pre.W, pre.H);
    const balloons = balloonMask(pre.gray, clean, pre.W, pre.H, darkInk);
    return Object.assign({}, pre, { binO, binA: clean, binS, balloons, darkInk });
  }

  /* ---------- one full detection pass on a prepared polarity ---------- */
  function evaluate(prep, P, weights, grid) {
    const ctx = buildCtx(prep, P);
    const { res, times } = runEngines(ctx, P, prep.skipEngines);
    const layouts = [];
    for (const k in res) {
      if (!res[k].length) continue;
      const sc = scoreLayout(res[k], ctx, grid);
      layouts.push({ key: k, panels: res[k], score: sc.score, terms: sc.terms, engine: k });
    }
    const fused = fuse(res, weights || {}, ctx);
    if (fused.length) {
      const sc = scoreLayout(fused, ctx, grid);
      layouts.push({ key: "fused", panels: fused, score: sc.score * 1.02, terms: sc.terms, engine: "fused" });
    }
    // one-vs-two disagreement: if any engine says 1 page-filling panel and another says N,
    // both interpretations are already present as separate layouts and the scorer decides.
    layouts.sort((a, b) => b.score - a.score);
    return { ctx, layouts, times, engineResults: res };
  }

  /* ---------- autotune driver ---------- */
  function detect(job) {
    const t0 = Date.now();
    const { rgba, W: W0, H: H0 } = job;
    const opts = job.opts || {};
    const weights = job.weights || {};
    const grid = job.grid || null;
    const budget = opts.samples || CONFIG.TUNE_SAMPLES;
    const pre = preprocess(rgba, W0, H0, opts);
    // polarity detection: prepare both, cheap-probe each with the seed params, keep the winner
    const probes = [];
    for (const dark of [true, false]) {
      const prep = makePolarity(pre, dark);
      prep.skipEngines = opts.skipEngines;
      const r = evaluate(prep, Object.assign({}, CONFIG.P, opts.seedParams || {}), weights, grid);
      probes.push({ prep, r, dark });
    }
    probes.sort((a, b) => (b.r.layouts[0] ? b.r.layouts[0].score : 0) - (a.r.layouts[0] ? a.r.layouts[0].score : 0));
    const prep = probes[0].prep;
    const polarity = probes[0].dark ? "dark-ink/light-gutter" : "light-ink/dark-gutter";

    // seeds: previous page's winner first (warm start), then Halton samples
    const seeds = [];
    if (opts.seedParams && CONFIG.WARM_START_BONUS) seeds.push(vectorFromParams(Object.assign({}, CONFIG.P, opts.seedParams)));
    seeds.push(vectorFromParams(CONFIG.P));
    const dims = TUNE_DIMS.length + 1;
    for (let i = 1; seeds.length < budget; i++) {
      const v = []; for (let d = 0; d < dims; d++) v.push(halton(i + 7, [2, 3, 5, 7, 11, 13, 17, 19, 23][d % 9]));
      seeds.push(v);
    }
    let best = null, evals = 0;
    const trail = [];
    for (const v of seeds) {
      const P = paramsFromVector(v, CONFIG.P);
      const r = evaluate(prep, P, weights, grid); evals++;
      const top = r.layouts[0];
      const sc = top ? top.score : 0;
      trail.push({ s: +sc.toFixed(3), bin: P.binVariant });
      if (!best || sc > best.score) best = { score: sc, v, P, r };
      if (sc >= CONFIG.TUNE_EARLY) break;  // early exit: clean pages cost almost nothing
    }
    // coordinate descent refinement on the winner
    if (best.score < CONFIG.TUNE_EARLY) {
      for (let pass = 0; pass < CONFIG.TUNE_REFINE; pass++) {
        const step = 0.16 / (pass + 1);
        for (let d = 0; d < dims; d++) {
          for (const sgn of [1, -1]) {
            const v = best.v.slice(); v[d] = clamp01(v[d] + sgn * step);
            if (v[d] === best.v[d]) continue;
            const P = paramsFromVector(v, CONFIG.P);
            const r = evaluate(prep, P, weights, grid); evals++;
            const sc = r.layouts[0] ? r.layouts[0].score : 0;
            if (sc > best.score) { best = { score: sc, v, P, r }; }
          }
          if (best.score >= CONFIG.TUNE_EARLY) break;
        }
        if (best.score >= CONFIG.TUNE_EARLY) break;
      }
    }
    // distinct alternative layouts for the carousel
    const alts = [];
    for (const L of best.r.layouts) {
      if (alts.some(a => layoutSimilar(a.panels, L.panels))) continue;
      alts.push({ engine: L.engine, score: L.score, terms: L.terms, panels: L.panels.map(cleanP) });
      if (alts.length >= CONFIG.ALT_LAYOUTS) break;
    }
    const chosen = alts[0] || { engine: "none", score: 0, panels: [], terms: {} };
    // per-panel confidence for the chosen layout, computed against all engine results
    const withConf = attachConfidence(chosen.panels, best.r.engineResults, best.r.ctx);
    // map back to working (unrectified) coordinates for export
    const Finv = mat3inv(prep.F);
    for (const p of withConf) p.quadW = (p.quad || p.poly || quadOf(p)).map(([x, y]) => applyM(Finv, x, y));
    for (const a of alts) for (const p of a.panels) p.quadW = (p.quad || p.poly || quadOf(p)).map(([x, y]) => applyM(Finv, x, y));

    return {
      panels: withConf,
      score: best.score,
      layouts: alts,
      params: best.P,
      polarity,
      preNote: pre.note,
      rectW: prep.W, rectH: prep.H,
      engineTimes: best.r.times,
      engineCounts: Object.keys(best.r.engineResults).reduce((o, k) => (o[k] = best.r.engineResults[k].length, o), {}),
      terms: chosen.terms,
      evals, trail: trail.slice(0, 26),
      ms: Date.now() - t0
    };
  }
  function cleanP(p) { return { x: p.x, y: p.y, w: p.w, h: p.h, quad: p.quad, poly: p.poly, conf: p.conf }; }
  function layoutSimilar(a, b) {
    if (Math.abs(a.length - b.length) > 0) return false;
    let s = 0; for (const p of a) { let m = 0; for (const q of b) m = Math.max(m, iou(p, q)); s += m; }
    return s / Math.max(1, a.length) > 0.9;
  }
  function attachConfidence(panels, engineResults, ctx) {
    const engKeys = Object.keys(engineResults).filter(k => engineResults[k].length);
    const out = [];
    for (const p of panels) {
      let agree = 0;
      for (const k of engKeys) if (engineResults[k].some(q => iou(q, p) >= CONFIG.AGREE_IOU)) agree++;
      const sup = perimeterSupport(ctx.edgeI, ctx.W, ctx.H, p);
      const x0 = clampi(p.x, 0, ctx.W - 1), y0 = clampi(p.y, 0, ctx.H - 1);
      const x1 = clampi(p.x + p.w, 0, ctx.W - 1), y1 = clampi(p.y + p.h, 0, ctx.H - 1);
      const dens = (x1 > x0 && y1 > y0) ? boxSum(ctx.maskI, ctx.W, x0, y0, x1, y1) / ((x1 - x0) * (y1 - y0)) : 0;
      const conf = clamp01(
        0.52 * (engKeys.length ? agree / Math.max(2, Math.min(5, engKeys.length)) : 0) +
        0.26 * sup + 0.12 * Math.min(1, dens / 0.12) + 0.10 * (p.conf || 0.5));
      out.push(Object.assign({}, p, { conf, agree, support: sup, density: dens }));
    }
    return out;
  }

  /* ==========================================================================
   * ISSUE-GRID LEARNING -- comics in one issue share a production template. Gather
   * every panel edge from high-scoring pages in normalised page space, cluster per
   * axis (1-D mean shift) to recover margins, column lines, row lines and canonical
   * gutter, then re-run weak pages with that grid as a strong prior.
   * ========================================================================== */
  function learnGrid(pages) {
    const xs = [], ys = [], gutters = [];
    for (const pg of pages) {
      if (!pg.panels || !pg.panels.length || pg.score < 0.7) continue;
      for (const p of pg.panels) {
        xs.push(p.x / pg.rectW, (p.x + p.w) / pg.rectW);
        ys.push(p.y / pg.rectH, (p.y + p.h) / pg.rectH);
      }
      if (pg.gutter) gutters.push(pg.gutter);
    }
    if (xs.length < 8) return null;
    const cols = meanShift1D(xs, 0.022), rows = meanShift1D(ys, 0.018);
    const strongC = cols.filter(c => c.n >= Math.max(2, xs.length * 0.06)).map(c => c.c);
    const strongR = rows.filter(c => c.n >= Math.max(2, ys.length * 0.05)).map(c => c.c);
    if (strongC.length < 2 || strongR.length < 2) return null;
    const margins = {
      left: Math.min.apply(null, strongC), right: Math.max.apply(null, strongC),
      top: Math.min.apply(null, strongR), bottom: Math.max.apply(null, strongR)
    };
    const gut = gutters.length ? gutters.reduce((a, b) => a + b, 0) / gutters.length : 0.012;
    return { cols: strongC.sort((a, b) => a - b), rows: strongR.sort((a, b) => a - b), margins, gutter: gut, samples: xs.length / 2 };
  }
  function meanShift1D(vals, bw) {
    const v = vals.slice().sort((a, b) => a - b), out = [];
    let i = 0;
    while (i < v.length) {
      let c = v[i], prev = -1, guard = 0;
      while (Math.abs(c - prev) > 1e-4 && guard++ < 30) {
        prev = c; let s = 0, n = 0;
        for (const x of v) if (Math.abs(x - c) <= bw) { s += x; n++; }
        if (!n) break; c = s / n;
      }
      let n = 0, j = i;
      while (j < v.length && v[j] <= c + bw) { n++; j++; }
      out.push({ c, n });
      i = Math.max(i + 1, j);
    }
    // merge near-duplicates
    const merged = [];
    for (const o of out) {
      const last = merged[merged.length - 1];
      if (last && Math.abs(last.c - o.c) < bw * 0.6) { last.c = (last.c * last.n + o.c * o.n) / (last.n + o.n); last.n += o.n; }
      else merged.push(o);
    }
    return merged;
  }
  function snapToGrid(panels, grid, W, H) {
    const tx = W * CONFIG.GRID_SNAP_FRAC, ty = H * CONFIG.GRID_SNAP_FRAC;
    const snap = (v, lines, dim, tol) => {
      let best = v, bd = tol;
      for (const L of lines) { const d = Math.abs(v - L * dim); if (d < bd) { bd = d; best = L * dim; } }
      return best;
    };
    return panels.map(p => {
      const x0 = snap(p.x, grid.cols, W, tx), x1 = snap(p.x + p.w, grid.cols, W, tx);
      const y0 = snap(p.y, grid.rows, H, ty), y1 = snap(p.y + p.h, grid.rows, H, ty);
      if (x1 - x0 < W * 0.05 || y1 - y0 < H * 0.05) return p;
      return Object.assign({}, p, { x: x0, y: y0, w: x1 - x0, h: y1 - y0, snapped: true });
    });
  }
  /* Grid-seeded segmentation for pages unsolvable in isolation (full-bleed / borderless):
     cut the page on the learned column/row lines, then keep cells with real content. */
  function gridSegment(ctx, grid) {
    const { W, H, maskI } = ctx;
    const xs = Array.from(new Set(grid.cols.map(c => Math.round(c * W)).concat([0, W]))).sort((a, b) => a - b);
    const ys = Array.from(new Set(grid.rows.map(c => Math.round(c * H)).concat([0, H]))).sort((a, b) => a - b);
    const out = [];
    for (let i = 0; i < xs.length - 1; i++) for (let j = 0; j < ys.length - 1; j++) {
      const r = { x: xs[i], y: ys[j], w: xs[i + 1] - xs[i], h: ys[j + 1] - ys[j] };
      if (r.w < W * 0.08 || r.h < H * 0.06) continue;
      const d = boxSum(maskI, W, r.x, r.y, Math.min(W - 1, r.x + r.      w - 1), Math.min(H - 1, r.y + r.h - 1)) / (r.w * r.h);
      if (d < 0.045) continue;      // empty cell: page margin or bleed, not a panel
      out.push(r);
    }
    return out;
  }

  /* ==========================================================================
   * GRID-PRIOR DETECTION (consensus pass). Runs the normal search with the grid
   * scorer term active, then additionally proposes a pure grid segmentation and a
   * grid-snapped version of the classical winner, and keeps whichever the scorer
   * prefers. A borderless page that is unsolvable alone becomes solvable because
   * other pages already revealed where the columns are.
   * ========================================================================== */
  function detectWithGrid(job) {
    const grid = job.grid;
    const base = detect(job);                     // grid term already active via job.grid
    if (!grid) return base;
    const pre = preprocess(job.rgba, job.W, job.H, job.opts || {});
    const prep = makePolarity(pre, base.polarity.indexOf("dark-ink") === 0);
    prep.skipEngines = (job.opts || {}).skipEngines;
    const ctx = buildCtx(prep, base.params);
    const cands = [];
    const gseg = sanitize(gridSegment(ctx, grid), ctx.W, ctx.H);
    if (gseg.length) {
      const sc = scoreLayout(gseg, ctx, grid);
      cands.push({ engine: "issue-grid", score: sc.score, terms: sc.terms, panels: gseg });
    }
    if (base.panels.length) {
      const snapped = sanitize(snapToGrid(base.panels.map(cleanP), grid, ctx.W, ctx.H), ctx.W, ctx.H);
      const sc = scoreLayout(snapped, ctx, grid);
      cands.push({ engine: "grid-snapped", score: sc.score, terms: sc.terms, panels: snapped });
    }
    cands.sort((a, b) => b.score - a.score);
    if (!cands.length || cands[0].score <= base.score + 0.004) return base;
    const win = cands[0];
    const withConf = attachConfidence(win.panels, Object.assign({ grid: win.panels }, {}), ctx);
    const Finv = mat3inv(prep.F);
    for (const p of withConf) p.quadW = (p.quad || p.poly || quadOf(p)).map(([x, y]) => applyM(Finv, x, y));
    const layouts = [{ engine: win.engine, score: win.score, terms: win.terms, panels: win.panels.map(cleanP) }]
      .concat(base.layouts).slice(0, CONFIG.ALT_LAYOUTS);
    for (const a of layouts) for (const p of a.panels)
      if (!p.quadW) p.quadW = (p.quad || p.poly || quadOf(p)).map(([x, y]) => applyM(Finv, x, y));
    return Object.assign({}, base, {
      panels: withConf, score: win.score, layouts, terms: win.terms,
      gridUsed: win.engine, rectW: ctx.W, rectH: ctx.H
    });
  }

  /* ==========================================================================
   * MAIN-THREAD FALLBACK PATH -- identical algorithms, but as a generator so the
   * driver can await a frame between evaluations. Used when file:// blocks Blob
   * workers; the UI stays responsive because no single yield-to-yield slice runs
   * long (one engine sweep on a 1400px page is a few ms to ~40ms; the driver also
   * lowers the working cap on slow devices).
   * ========================================================================== */
  function* detectIter(job) {
    const t0 = Date.now();
    const opts = job.opts || {}, weights = job.weights || {}, grid = job.grid || null;
    const budget = opts.samples || CONFIG.TUNE_SAMPLES;
    const pre = preprocess(job.rgba, job.W, job.H, opts); yield;
    const probes = [];
    for (const dark of [true, false]) {
      const prep = makePolarity(pre, dark); prep.skipEngines = opts.skipEngines; yield;
      const r = evaluate(prep, Object.assign({}, CONFIG.P, opts.seedParams || {}), weights, grid);
      probes.push({ prep, r, dark }); yield;
    }
    probes.sort((a, b) => (b.r.layouts[0] ? b.r.layouts[0].score : 0) - (a.r.layouts[0] ? a.r.layouts[0].score : 0));
    const prep = probes[0].prep;
    const polarity = probes[0].dark ? "dark-ink/light-gutter" : "light-ink/dark-gutter";
    const seeds = [];
    if (opts.seedParams) seeds.push(vectorFromParams(Object.assign({}, CONFIG.P, opts.seedParams)));
    seeds.push(vectorFromParams(CONFIG.P));
    const dims = TUNE_DIMS.length + 1;
    for (let i = 1; seeds.length < budget; i++) {
      const v = []; for (let d = 0; d < dims; d++) v.push(halton(i + 7, [2, 3, 5, 7, 11, 13, 17, 19, 23][d % 9]));
      seeds.push(v);
    }
    let best = null, evals = 0; const trail = [];
    for (const v of seeds) {
      const P = paramsFromVector(v, CONFIG.P);
      const r = evaluate(prep, P, weights, grid); evals++;
      const sc = r.layouts[0] ? r.layouts[0].score : 0;
      trail.push({ s: +sc.toFixed(3), bin: P.binVariant });
      if (!best || sc > best.score) best = { score: sc, v, P, r };
      if (sc >= CONFIG.TUNE_EARLY) break;
      yield;
    }
    if (best.score < CONFIG.TUNE_EARLY) {
      outer:
      for (let pass = 0; pass < CONFIG.TUNE_REFINE; pass++) {
        const step = 0.16 / (pass + 1);
        for (let d = 0; d < dims; d++) {
          for (const sgn of [1, -1]) {
            const v = best.v.slice(); v[d] = clamp01(v[d] + sgn * step);
            if (v[d] === best.v[d]) continue;
            const r = evaluate(prep, paramsFromVector(v, CONFIG.P), weights, grid); evals++;
            if ((r.layouts[0] ? r.layouts[0].score : 0) > best.score)
              best = { score: r.layouts[0].score, v, P: paramsFromVector(v, CONFIG.P), r };
            yield;
          }

    const alts = [];

      if (alts.some(a => layoutSimilar(a.panels, L.panels))) continue;

      if (alts.length >= CONFIG.ALT_LAYOUTS) break;
    }

    const withConf = attachConfidence(chosen.panels, best.r.engineResults, best.r.ctx);
    const Finv = mat3inv(prep.F);
    for (const p of withConf) p.quadW = (p.quad || p.poly || quadOf(p)).map(([x, y]) => applyM(Finv, x, y));
    for (const a of alts) for (const p of a.panels) p.quadW = (p.quad || p.poly || quadOf(p)).map(([x, y]) => applyM(Finv, x, y));

      preNote: pre.note, rectW: prep.W, rectH: prep.H, engineTimes: best.r.times,
      engineCounts: Object.keys(best.r.engineResults).reduce((o, k) => (o[k] = best.r.engineResults[k].length, o), {}),

  /* geometric helper used by the export mapper for tilted quads */
  function uprightMap(quad) {
    // order the quad TL,TR,BR,BL then solve a homography to an axis-aligned rect
    const cx = (quad[0][0] + quad[1][0] + quad[2][0] + quad[3][0]) / 4;
    const cy = (quad[0][1] + quad[1][1] + quad[2][1] + quad[3][1]) / 4;
    const s = quad.slice().sort((a, b) => Math.atan2(a[1] - cy, a[0] - cx) - Math.atan2(b[1] - cy, b[0] - cx));

    const wBot = Math.hypot(o[2][0] - o[3][0], o[2][1] - o[3][1]);
    const hL = Math.hypot(o[3][0] - o[0][0], o[3][1] - o[0][1]);
    const hR = Math.hypot(o[2][0] - o[1][0], o[2][1] - o[1][1]);

  }

  return {
    init(cfg) {
      CONFIG = cfg;
      CONFIG.MIN_PANEL_AREA_FRAC_LOCAL = cfg.MIN_PANEL_AREA_FRAC;
    },
    detect, detectWithGrid, detectIter, learnGrid, snapToGrid, scoreLayout,
    preprocess, makePolarity, buildCtx, evaluate, fuse, sanitize,
    iou, contains, rectOf, quadOf, polyArea, homography, mat3inv, applyM, uprightMap,
    perimeterSupport, integral, boxSum, clusterCoords, ENGINE_KEYS: ENGINES.map(e => e.key)

}

/* ============================================================================
 * WORKERS -- Blob-URL workers built from the stringified core. Under file:// some
 * browsers refuse Blob workers (and iOS Safari sometimes refuses them for
 * cross-origin-isolation reasons); we probe once and fall back to the yielding
 * main-thread generator path so the UI never freezes either way.
 * ========================================================================== */
const Workers = (() => {
  const CORE_SRC = DetectionCoreFactory.toString();
  const WORKER_SRC = `
"use strict";
const DetectionCoreFactory = ${CORE_SRC};
let core = null;
self.onmessage = function(ev){
  const m = ev.data;
  try{
    if(m.type === "init"){ core = DetectionCoreFactory(); core.init(m.config); self.postMessage({type:"ready", id:m.id}); return; }
    if(m.type === "detect"){
      const job = m.job;
      job.rgba = new Uint8ClampedArray(m.buf);
      const out = job.grid ? core.detectWithGrid(job) : core.detect(job);
      self.postMessage({type:"result", id:m.id, out:out});
      return;
    }
    if(m.type === "grid"){ self.postMessage({type:"result", id:m.id, out: core.learnGrid(m.pages)}); return; }
  }catch(e){ self.postMessage({type:"error", id:m.id, msg: String(e && e.message || e), stack: String(e && e.stack || "")}); }
};`;
  let pool = [], blobURL = null, available = false, probed = false;
  let seq = 0; const waiting = new Map();
  const local = DetectionCoreFactory(); local.init(CONFIG);

  function makeWorker() {
    const w = new Worker(blobURL);
    w.onmessage = (ev) => {
      const m = ev.data, entry = waiting.get(m.id);
      if (!entry) return;
      if (m.type === "result") { waiting.delete(m.id); entry.busyRef.busy = false; entry.res(m.out); }
      else if (m.type === "error") { waiting.delete(m.id); entry.busyRef.busy = false; entry.rej(new Error(m.msg)); }
      else if (m.type === "ready") { waiting.delete(m.id); entry.res(true); }
    };
    w.onerror = (e) => { Logger.warn("worker", "runtime error", String(e.message || "")); };
    return { w, busy: false };
  }
  async function probe() {
    if (probed) return available;
    probed = true;
    const lowMem = (navigator.deviceMemory || navigator.hardwareConcurrency || 4) <= 2;
    const n = lowMem ? 1 : Math.max(1, Math.min((navigator.hardwareConcurrency || 4) - 1, 4));
    try {
      const blob = new Blob([WORKER_SRC], { type: "text/javascript" });
      blobURL = URL.createObjectURL(blob);
      const first = makeWorker();
      await new Promise((res, rej) => {
        const id = ++seq;
        waiting.set(id, { res, rej, busyRef: first });
        first.w.postMessage({ type: "init", id, config: CONFIG });
        setTimeout(() => { if (waiting.has(id)) { waiting.delete(id); rej(new Error("worker init timeout")); } }, 4000);
      });
      pool.push(first);
      for (let i = 1; i < n; i++) {
        const wk = makeWorker();
        wk.w.postMessage({ type: "init", id: ++seq, config: CONFIG });
        pool.push(wk);
      }
      available = true;
      Logger.info("worker", "blob worker pool ready", { workers: pool.length });
    } catch (e) {
      available = false;
      Logger.warn("worker", "blob workers blocked -- using yielding main-thread path", String(e.message || e));
      if (blobURL) { URL.revokeObjectURL(blobURL); blobURL = null; }
      pool = [];
    }
    return available;
  }
  function freeWorker() { return pool.find(p => !p.busy) || null; }
  /* Detection dispatch. Transfers the pixel ArrayBuffer (never structured-clones it). */
  async function detect(job) {
    await probe();
    if (available) {
      const wk = await new Promise((res) => {
        const tick = () => { const f = freeWorker(); if (f) res(f); else setTimeout(tick, 12); }; tick();
      });
      wk.busy = true;
      const buf = job.rgba.buffer;
      const payload = Object.assign({}, job); delete payload.rgba;
      return new Promise((res, rej) => {
        const id = ++seq;
        waiting.set(id, { res, rej, busyRef: wk });
        wk.w.postMessage({ type: "detect", id, job: payload, buf }, [buf]);
      });
    }
    // fallback: drive the generator, yielding a frame between evaluations
    const it = local.detectIter(job);
    for (; ;) {
      const t0 = nowMs();
      let r;
      do { r = it.next(); } while (!r.done && nowMs() - t0 < 10);
      if (r.done) return r.value;
      await nextFrame();
    }
  }
  return {
    probe, detect,
    get available() { return available; },
    get size() { return pool.length; },
    localCore: local,
    learnGrid: (pages) => local.learnGrid(pages),
    dispose() { for (const p of pool) p.w.terminate(); pool = []; if (blobURL) URL.revokeObjectURL(blobURL); }
  };
})();

/* ============================================================================
 * CODECS -- CRC-32, raw DEFLATE inflate, ZIP reader, store-only ZIP writer,
 * EXIF orientation, PDF image + rectangle extraction, ACBF frames.
 * All hand-written; no libraries.
 * ========================================================================== */
const CRC = (() => {
  const T = new Uint32Array(256);

    let c = 0xFFFFFFFF;
    for (let i = 0; i < u8.length; i++) c = T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  };
})();

/* Raw DEFLATE decoder (RFC 1951): stored, fixed and dynamic Huffman blocks.

/* --- ZIP reader via the End Of Central Directory record (robust to prefixes) --- */
async function readZip(file) {
  const size = file.size;

  let eocd = -1;

    if (tail[i] === 0x50 && tail[i + 1] === 0x4B && tail[i + 2] === 0x05 && tail[i + 3] === 0x06) { eocd = i; break; }

  const count = dv.getUint16(eocd + 10, true);
  const cdSize = dv.getUint32(eocd + 12, true);
  const cdOff = dv.getUint32(eocd + 16, true);
  const cd = new Uint8Array(await file.slice(cdOff, cdOff + cdSize).arrayBuffer());
  const cdv = new DataView(cd.buffer, cd.byteOffset);
  const entries = [];
  let p = 0;
  for (let i = 0; i < count && p + 46 <= cd.length; i++) {
    if (cdv.getUint32(p, true) !== 0x02014b50) break;
    const method = cdv.getUint16(p + 10, true);
    const cSize = cdv.getUint32(p + 20, true);
    const uSize = cdv.getUint32(p + 24, true);
    const nLen = cdv.getUint16(p + 28, true);
    const eLen = cdv.getUint16(p + 30, true);
    const cLen = cdv.getUint16(p + 32, true);
    const lho = cdv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(cd.subarray(p + 46, p + 46 + nLen));

    const head = new Uint8Array(await file.slice(entry.lho, entry.lho + 30).arrayBuffer());
    const hv = new DataView(head.buffer, head.byteOffset);
    if (hv.getUint32(0, true) !== 0x04034b50) throw new Error("corrupt local header in archive");
    const nLen = hv.getUint16(26, true), eLen = hv.getUint16(28, true);

/* --- store-only ZIP writer. Store is correct here: PNG/JPEG/WebP are already

    t: ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF,
    d: (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF

/* --- EXIF orientation, parsed by hand. Browser auto-orientation is inconsistent
       under file://, so we always read the tag and apply the transform ourselves. --- */
async function exifOrientation(file) {
  try {
    const head = new Uint8Array(await file.slice(0, 131072).arrayBuffer());
    if (head[0] !== 0xFF || head[1] !== 0xD8) return 1;
    let p = 2;
    while (p + 4 < head.length) {
      if (head[p] !== 0xFF) { p++; continue; }
      const marker = head[p + 1], len = (head[p + 2] << 8) | head[p + 3];
      if (marker === 0xE1 &&
        head[p + 4] === 0x45 && head[p + 5] === 0x78 && head[p + 6] === 0x69 && head[p + 7] === 0x66) {
        const tiff = p + 10;
        const le = head[tiff] === 0x49;
        const dv = new DataView(head.buffer, head.byteOffset);
        const g16 = (o) => le ? dv.getUint16(o, true) : dv.getUint16(o, false);
        const g32 = (o) => le ? dv.getUint32(o, true) : dv.getUint32(o, false);
        const ifd = tiff + g32(tiff + 4);
        const cnt = g16(ifd);
        for (let i = 0; i < cnt; i++) {
          const e = ifd + 2 + i * 12;
          if (g16(e) === 0x0112) { const v = g16(e + 8); return v >= 1 && v <= 8 ? v : 1; }
        }
        return 1;
      }
      if (marker === 0xD9 || marker === 0xDA) break;
      p += 2 + len;
    }
  } catch (e) { Logger.warn("exif", "orientation parse failed", String(e.message || e)); }
  return 1;
}

/* --- ACBF: exact panel polygons. Free ground truth; we use it and say so. --- */

  const doc = new DOMParser().parseFromString(text, "application/xml");
  if (doc.querySelector("parsererror")) throw new Error("ACBF file is not valid XML.");

  for (const pg of Array.from(doc.getElementsByTagName("page"))) {
    const img = pg.getElementsByTagName("image")[0];
    const href = img ? (img.getAttribute("href") || "") : "";

      const pts = (fr.getAttribute("points") || "").trim().split(/\s+/).map(p => p.split(",").map(Number)).filter(a => a.length === 2 && a.every(isFinite));
      if (pts.length >= 4) frames.push(pts);

/* ============================================================================
 * PERSISTENCE -- IndexedDB for project state + thumbnails; localStorage for the
 * few small settings only. Full-res pixels are never stored: we keep names, sizes
 * and a content hash and re-match sources on restore.
 * ========================================================================== */
const DB = (() => {
  let db = null, broken = false;
  function open() {
    if (db) return Promise.resolve(db);
    if (broken) return Promise.resolve(null);
    return new Promise((res) => {
      let req;
      try { req = indexedDB.open("panelforge", 3); }
      catch (e) { broken = true; Logger.warn("db", "IndexedDB unavailable", String(e.message || e)); return res(null); }
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains("projects")) d.createObjectStore("projects", { keyPath: "id" });
        if (!d.objectStoreNames.contains("thumbs")) d.createObjectStore("thumbs");
        if (!d.objectStoreNames.contains("models")) d.createObjectStore("models");
      };
      req.onsuccess = () => { db = req.result; res(db); };
      req.onerror = () => { broken = true; Logger.warn("db", "IndexedDB open failed"); res(null); };
      req.onblocked = () => { broken = true; res(null); };
    });
  }
  async function tx(store, mode, fn) {
    const d = await open(); if (!d) return null;
    return new Promise((res, rej) => {
      let t;
      try { t = d.transaction(store, mode); } catch (e) { return res(null); }
      const st = t.objectStore(store);
      let out;
      try { out = fn(st); } catch (e) { return rej(e); }
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
      t.onerror = () => { Logger.warn("db", "transaction failed", String(t.error && t.error.name)); res(null); };
      t.onabort = () => res(null);
    });
  }
  return {
    get available() { return !broken; },
    put: (store, val, key) => tx(store, "readwrite", st => key === undefined ? st.put(val) : st.put(val, key)),
    get: (store, key) => tx(store, "readonly", st => st.get(key)),
    del: (store, key) => tx(store, "readwrite", st => st.delete(key)),
    all: (store) => tx(store, "readonly", st => st.getAll()),
    clear: (store) => tx(store, "readwrite", st => st.clear())
  };
})();

const Persist = (() => {

    async list() { const a = await DB.all("projects"); return (a || []).sort((x, y) => y.updated - x.updated); },
    async putThumb(pid, pageId, blob) { await DB.put("thumbs", blob, pid + ":" + pageId); },
    async remove(id) {
      const p = await DB.get("projects", id);

  };
})();

/* ============================================================================
 * INGEST -- images, PDF, CBZ/ZIP, ACBF, folder drop, clipboard paste.
 * Produces page records with a cached 320px thumbnail and nothing else held.
 * ========================================================================== */
const Ingest = (() => {
  const IMG_RE = /\.(png|jpe?g|webp|gif|bmp|avif|heic|heif|tiff?)$/i;

    const ax = String(a).match(/(\d+|\D+)/g) || [], bx = String(b).match(/(\d+|\D+)/g) || [];

      if (x === undefined) return -1; if (y === undefined) return 1;

    const out = [];

      const name = f.name || "page";
      try {
        if (/\.(cbr|rar)$/i.test(name) || await looksLikeRar(f)) {
          onNote("CBR/RAR isn't supported -- RAR needs a proprietary decoder. Convert to CBZ and re-import.", "warn");
          Logger.warn("ingest", "CBR rejected", name);

        }
        if (/\.(cbz|zip)$/i.test(name) || f.type === "application/zip") {
          const z = await readZip(f);
          const acbf = z.entries.find(e => /\.(acbf|xml)$/i.test(e.name));
          let frames = null;
          if (acbf) {
            try {
              frames = parseAcbf(new TextDecoder().decode(await z.read(acbf)));
              if (frames.some(p => p.frames.length)) onNote("Exact panel data found in archive metadata.", "ok");
            } catch (e) { Logger.warn("ingest", "embedded ACBF parse failed", String(e.message || e)); }
          }
          const imgs = z.entries.filter(e => IMG_RE.test(e.name) && !/^__MACOSX|\/\._/.test(e.name))
            .sort((a, b) => natSort(a.name, b.name));

          if (rects.length) Logger.info("ingest", "PDF vector rectangles present", { streams: rects.length });

    if (longest > CONFIG.MAX_IMG) { onNote(""" + item.name + "" is enormous (" + d.w + "×" + d.h + ") -- processing a reduced copy.", "info"); }

/* Snap loose boxes (neural or cloud) onto strong classical edges. Neural boxes are
   semantically right but a few px loose; classical edges are pixel-tight but
   sometimes structurally wrong. This is the highest-value fusion step. */
function snapBoxesToEdges(boxes, edgeLines, W, H) {
  const tolX = W * 0.035, tolY = H * 0.035;
  const snap1 = (v, lines, tol) => {
    let best = v, bd = tol;
    for (const L of lines) { const d = Math.abs(v - L); if (d < bd) { bd = d; best = L; } }
    return best;
  };
  return boxes.map(b => {
    const x0 = snap1(b.x, edgeLines.xs, tolX), x1 = snap1(b.x + b.w, edgeLines.xs, tolX);
    const y0 = snap1(b.y, edgeLines.ys, tolY), y1 = snap1(b.y + b.h, edgeLines.ys, tolY);
    const nb = { x: x0, y: y0, w: x1 - x0, h: y1 - y0, conf: Math.min(0.95, (b.s || b.conf || 0.6) * 0.9 + 0.06), snapped: true };
    if (nb.w < W * 0.05 || nb.h < H * 0.04) return { x: b.x, y: b.y, w: b.w, h: b.h, conf: (b.s || 0.6) * 0.8 };

/* ============================================================================
 * CLOUD ASSIST -- opt-in, off by default, last resort. Gemini vision or Roboflow

/* ============================================================================
 * READING ORDER -- row-band sweep with LTR/RTL auto-detection, topological refine
 * for staircase layouts, insets following their parent.
 * ========================================================================== */
const ReadingOrder = (() => {
  /* RTL heuristic: manga pages put the first panel top-right and typically show a
     wider right margin on the first page plus right-anchored panel columns. We test
     which reading direction yields the more regular band structure. */
  function detectRTL(pages) {
    const mode = Store.s.settings.readingOrder;
    if (mode === "ltr") return false;

    for (const pg of pages) {
